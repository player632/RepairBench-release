<!doctype html>
<!-- We set all theme classes to allow critters to inline the theme styles and prevent flickering -->
<html lang="en" class="theme-dark--mode" data-testid="html-root">
  <head>
    <meta charset="utf-8" />
    <title i18n data-testid="page-title">Angular Example App</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: http://127.0.0.1:8931; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:8931"
    />


    <link rel="canonical" href="https://angular-example-app.ismaestro.com" />

    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

    <!-- Open Graph -->
    <meta name="apple-mobile-web-app-title" content="Angular Example App" />
    <meta name="application-name" content="Angular Example App" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://angular-example-app.ismaestro.com/" />
    <meta
      property="og:image"
      content="https://angular-example-app.ismaestro.com/assets/images/ng-image.jpg"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://angular-example-app.ismaestro.com/" />
    <meta
      property="twitter:image"
      content="https://angular-example-app.ismaestro.com/assets/images/ng-image.jpg"
    />


  </head>
  <body>
    <app-root data-testid="app-root"></app-root>
    <script>
      // This logic must execute early, so that we set the necessary
      // CSS classes to the document node and avoid unstyled content
      // from appearing on the page.
      const THEME_SELECTED_LOCAL_STORAGE_KEY = 'theme';
      const DARK_THEME_CLASS_NAME = 'theme-dark--mode';
      const LIGHT_THEME_CLASS_NAME = 'theme-light--mode';

      const theme = localStorage.getItem(THEME_SELECTED_LOCAL_STORAGE_KEY) ?? 'dark';
      const documentClassList = this.document.documentElement.classList;

      // clearing classes before setting them.
      this.document.documentElement.className = '';
      if (theme === 'dark') {
        documentClassList.add(DARK_THEME_CLASS_NAME);
      } else {
        documentClassList.add(LIGHT_THEME_CLASS_NAME);
      }
    </script>
    <!-- Google Tag Manager consent shim — GTM container (GTM-TJQKDC6M) is loaded lazily by AnalyticsService.
         The gtag() function is kept so CookieConsentService can push Consent Mode signals to the dataLayer. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
    </script>
    <!-- eslint-disable-next-line @angular-eslint/template/i18n -->
    <noscript>Please enable JavaScript to view this app.</noscript>
  </body>
</html>
