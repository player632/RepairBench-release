@let pokemon = pokemonResource.value();
@if (pokemon) {
  <div class="pokemon-search-input__container" data-testid="detail-search-input">
    <app-pokemon-search-input />
  </div>
  <app-pokemon-battlefield data-testid="battlefield" [pokemon]="pokemon" [pokemonBattleEvent]="pokemonBattleEvent" />
  <div class="pokedex__container">
    <app-pokedex data-testid="pokedex" [pokemon]="pokemon" [pokemonBattleEvent]="pokemonBattleEvent" />
  </div>
}
