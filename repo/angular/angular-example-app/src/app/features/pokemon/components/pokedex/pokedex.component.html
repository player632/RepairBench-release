<div class="pokedex__container" [class.closed]="isPokedexClosed()">
  <div
    class="pokedex__top-part-container"
    data-testid="pokedex-toggle"
    tabindex="0"
    (click)="togglePokedex()"
    (keydown)="togglePokedex()"
  >
    <div class="pokedex__flap-container">
      <figure class="pokedex__flap-front"></figure>
      <figure class="pokedex__flap-back">
        <div class="pokedex__top-data-container">
          <div class="pokedex__pokemon-image-container">
            <app-pokemon-image [image]="pokemonImage()" />
          </div>
          <div class="pokedex__top-text-container">
            @if (pokemon()) {
              <p class="pokemon__name-text" data-testid="pokedex-name">{{ pokemon()?.name | firstTitleCase }}</p>
              <p i18n data-testid="pokedex-order">N.º: {{ pokemon()?.order }}</p>
              <p i18n data-testid="pokedex-height">Height: {{ pokemon()?.height }} dm</p>
              <p i18n data-testid="pokedex-weight">Weight: {{ pokemon()?.weight }} hg</p>
            }
          </div>
        </div>
      </figure>
    </div>
  </div>
  <div class="pokedex__separator"></div>
  <div class="pokedex__bottom-part-container">
    <div class="pokedex__pad-container">
      <div class="pokedex__pad"></div>
      <div class="pokedex__pad-circle"></div>
    </div>
    <div class="pokedex__bottom-data-container">
      @if (userHasCaught()) {
        <p i18n data-testid="pokedex-status">
          🎯 Nice catch, {{ user?.name }}! You’re one step closer to being a Pokémon Master—keep it
          up! 🌟
        </p>
      } @else if (userHasPokemon()) {
        <p i18n data-testid="pokedex-status">Already got this one, keep going!</p>
      } @else {
        <p i18n data-testid="pokedex-status">Still gotta catch 'em all, this one's missing from your Pokédex!</p>
        <div class="pokedex-actions__container">
          <sl-button
            i18n
            class="button--pokemon-style"
            data-testid="pokedex-catch-button"
            [disabled]="isPokedexButtonDisabled()"
            (click)="catchPokemon()"
          >
            POKEBALL
          </sl-button>
        </div>
      }
    </div>
  </div>
  <div class="pokedex__joystick-container">
    <div class="pokedex__joystick-tracker">
      <div class="pokedex__joystick-button"></div>
    </div>
  </div>
</div>
