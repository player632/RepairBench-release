<sl-dropdown data-testid="language-selector">
  <sl-button
    class="dropdown-button--primary"
    data-testid="language-trigger"
    slot="trigger"
    caret
    [attr.aria-label]="translations.findMore"
    >{{
    localeIdText() | uppercase
    }}</sl-button
  >
  <div class="dropdown__content-container">
    <div class="dropdown__item-container">
      <a i18n data-testid="language-option-es" [href]="'/es' + router.url">ES-ES</a>
    </div>
    <div class="dropdown__item-container">
      <a i18n data-testid="language-option-en" [href]="router.url">EN-US</a>
    </div>
  </div>
</sl-dropdown>
