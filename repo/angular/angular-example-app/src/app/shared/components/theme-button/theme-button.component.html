<sl-button
  class="button--icon"
  data-testid="theme-toggle"
  [attr.aria-label]="translations.toggleTheme"
  (click)="toggleTheme()"
>
  @if (themeSelected() === Theme.DARK) {
    <sl-icon name="brightness-high-fill" data-testid="theme-icon" />
  } @else {
    <sl-icon name="moon" data-testid="theme-icon" />
  }
</sl-button>
