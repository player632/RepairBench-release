<p data-testid="startline-label">
    <span *ngIf="hasCurrent() else startingTmpl">
        Lines
    </span>
</p>
<t-number *ngIf="hasCurrent() else initLineTmpl"
          [num]="clearedLines()"
          prefix="startline">
</t-number>
<ng-template #startingTmpl>
    Start Line
</ng-template>
<ng-template #initLineTmpl>
    <t-number [num]="initLine()"
              prefix="startline">
    </t-number>
</ng-template>
