<p>Next</p>
<div class="next">
    <div class="row"
         *ngFor="let row of next(); let r = index; trackBy: trackByIndex">
        <t-tile [tile]='tile'
                [attr.data-testid]="'next-tile-' + (r * 4 + c)"
                *ngFor="let tile of row; let c = index; trackBy: trackByIndex">
        </t-tile>
    </div>
</div>
