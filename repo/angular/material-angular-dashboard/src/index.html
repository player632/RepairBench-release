<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Material Angular Dashboard</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/icons/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="assets/icons/favicon-16x16.png" sizes="16x16">
</head>
<body>
  <app-root></app-root>
  <!-- offline runtime shim: the seed loads the Google Maps JS API from
       the Google Maps JS API CDN here; with no network egress allowed that script
       never arrives and every map card dies with a ReferenceError on
       `google`. The stub below keeps the same global surface as an inert
       no-op so the map cards render empty but the rest of the application is
       unaffected. No map behaviour is part of this task. -->
  <script>
    (function () {
      function noop() {}
      function LatLng(lat, lng) { this.__lat = lat; this.__lng = lng; }
      LatLng.prototype.lat = function () { return this.__lat; };
      LatLng.prototype.lng = function () { return this.__lng; };
      LatLng.prototype.toString = function () { return '(' + this.__lat + ', ' + this.__lng + ')'; };
      function Point(x, y) { this.x = x; this.y = y; }
      function Size(w, h) { this.width = w; this.height = h; }
      function Map(el, opts) { this.__el = el; this.__opts = opts || {}; }
      Map.prototype.addListener = noop;
      Map.prototype.setZoom = noop;
      Map.prototype.setOptions = noop;
      Map.prototype.setCenter = noop;
      Map.prototype.panTo = noop;
      Map.prototype.getZoom = function () { return typeof this.__opts.zoom === 'number' ? this.__opts.zoom : 2; };
      Map.prototype.getDiv = function () { return this.__el; };
      Map.prototype.getCenter = function () { return new LatLng(53, 27); };
      Map.prototype.getBounds = function () {
        return {
          contains: function () { return false; },
          getNorthEast: function () { return new LatLng(0, 0); },
          getSouthWest: function () { return new LatLng(0, 0); }
        };
      };
      Map.prototype.getProjection = function () {
        return {
          fromLatLngToPoint: function () { return new Point(0, 0); },
          fromPointToLatLng: function () { return new LatLng(0, 0); }
        };
      };
      function Marker(opts) { this.__opts = opts || {}; }
      Marker.prototype.addListener = noop;
      Marker.prototype.setMap = noop;
      Marker.prototype.setIcon = noop;
      Marker.prototype.setAnimation = noop;
      Marker.prototype.getAnimation = function () { return null; };
      Marker.prototype.getPosition = function () { return this.__opts.position || new LatLng(0, 0); };
      Marker.prototype.getTitle = function () { return this.__opts.title || ''; };
      window.google = window.google || {};
      window.google.maps = {
        Map: Map,
        Marker: Marker,
        LatLng: LatLng,
        Point: Point,
        Size: Size,
        Animation: { DROP: 'DROP', BOUNCE: 'BOUNCE' },
        ControlPosition: { TOP_LEFT: 1, TOP_RIGHT: 2, BOTTOM_LEFT: 3, BOTTOM_RIGHT: 4, RIGHT_TOP: 5, LEFT_TOP: 6, RIGHT_BOTTOM: 7, LEFT_BOTTOM: 8 },
        MapTypeId: { ROADMAP: 'roadmap', SATELLITE: 'satellite', HYBRID: 'hybrid', TERRAIN: 'terrain' },
        SymbolPath: { CIRCLE: 0, FORWARD_CLOSED_ARROW: 1, BACKWARD_CLOSED_ARROW: 2 },
        ScaleControlStyle: { DEFAULT: 0 },
        ZoomControlStyle: { DEFAULT: 0, SMALL: 1, LARGE: 2 },
        event: { addListener: noop, addDomListener: noop, removeListener: noop, clearListeners: noop, trigger: noop },
        geometry: { spherical: { computeDistanceBetween: function () { return 0; } } }
      };
    })();
  </script>
</body>
</html>
