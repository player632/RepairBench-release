@let todos = store.visibleTodos();

@if (todos.length > 0) {
  <footer class="footer" data-testid="app-footer">
    <app-counter />
    @let filter = store.filter();

    <ul class="filters">
      <li>
        <a routerLink="/" data-testid="filter-all" [class.selected]="filter === 'all'">All</a>
      </li>
      <li>
        <a routerLink="/pending" data-testid="filter-pending" [class.selected]="filter === 'pending'">Pending</a>
      </li>
      <li>
        <a routerLink="/completed" data-testid="filter-completed" [class.selected]="filter === 'completed'">Completed</a>
      </li>
    </ul>

    <app-clear-btn />
  </footer>
}
