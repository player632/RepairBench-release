<li
  data-testid="todo-item"
  [ngClass]="{
    completed: todo().completed,
    editing: editingMode,
  }"
  (dblclick)="enableEditingMode()"
>
  <div class="view">
    <input (change)="toggle()" class="toggle" data-testid="todo-toggle" type="checkbox" />
    <label data-testid="todo-label">{{ todo().title }}</label>
    <button type="button" class="destroy" data-testid="todo-destroy" (click)="remove()"></button>
  </div>
  <input
    #inputElement
    data-testid="todo-edit"
    class="edit"
    [formControl]="titleControl"
    (keyup.enter)="update()"
    (keyup.esc)="escape()"
  />
</li>
