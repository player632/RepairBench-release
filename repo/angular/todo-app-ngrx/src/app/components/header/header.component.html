<header class="header">
  <div class="container">
    <h1 data-testid="app-title">My Day</h1>
    <p>All my tasks in one place</p>
    <input
      class="new-todo"
      data-testid="new-todo"
      placeholder="Type new todo"
      type="text"
      [formControl]="titleControl"
      (keyup.enter)="addTodo()"
    />
  </div>
</header>
