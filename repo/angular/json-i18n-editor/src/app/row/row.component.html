<div *ngIf="item.showCategory" class="category" data-testid="cell-group-label">
  {{ item.category }}
</div>

<div class="name" data-testid="cell-key">
  {{ item.name }}
</div>

<div class="all-i18n">

  <div
    *ngIf="!hideSourceLanguage"
    class="text-box"
    data-testid="cell-source"
  >
    <span class="original-text" data-testid="cell-source-text">
      {{ item.text }}
    </span>
  </div>

  <div
    #editor1
    class="translation"
    data-testid="cell-reference"
  ></div>

  <div
    #editor2
    (keyup)="findDiff()"
    class="editor"
    data-testid="cell-editor"
  ></div>

</div>
