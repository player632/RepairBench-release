<div class="heading">
  <img src="assets/logo.svg">
</div>

<!-- =========================================================================================== -->

<div class="help" data-testid="help-trigger">?</div>
<div class="help-text" data-testid="help-body">
  <ul>
    <li>
      No text formatting should be added.
    </li>
    <li>
      Text like <pre>&#123;intl_something&#125;</pre> should not be removed.
    </li>
  </ul>
</div>

<!-- =========================================================================================== -->

<select
  (change)="changeCategory($event.target.value)"
  class="select-category"
  data-testid="group-select"
  [ngClass]="{ 'input-changed': selectedPage !== 'none' }"
>
  <option selected value="none" [selected]="selectedPage === 'none'">All website text</option>
  <option *ngFor="let category of categories">{{ category }}</option>
</select>

<select
  (change)="changeView($event.target.value)"
  class="select-view"
  data-testid="view-select"
  [ngClass]="{ 'input-changed': viewType !== 'everything' }"
>
  <option value="everything" [selected]="viewType === 'everything'">Showing everything</option>
  <option value="untranslated" [selected]="viewType === 'untranslated'">Showing untranslated</option>
  <option value="modified" [selected]="viewType === 'modified'">Showing modified</option>
</select>

  <button class="button-hide-column" data-testid="column-toggle" (click)="toggleHideColumn()">
    {{
      hideSourceLanguage ?
          'Show ' + languageNames[SOURCE_LANGUAGE]
        : 'Hide ' + languageNames[SOURCE_LANGUAGE]
    }}
    column
  </button>

<!-- =========================================================================================== -->

<virtual-scroller
  #scroll
  id="scrollDiv"
  class="scrolling-block"
  data-testid="scroll-pane"
  [enableUnequalChildrenSizes]="true"
  [items]="mainObject | mySelectionPipe : selectedPage
                      | mySearchPipe : filterText : true
                      | mySearchPipe : filterText2 : false
                      | myViewPipe : viewType
                      | showOncePipe"
>

  <app-row-component
    *ngFor="let item of scroll.viewPortItems"
    [item]="item"
    [hideSourceLanguage]="hideSourceLanguage"
    [rtlLanguage]="login.language === 'ur'"
    [attr.data-testid]="'row-' + item.category + '-' + item.name"
    class="full-row"
  ></app-row-component>

</virtual-scroller>

<!-- =========================================================================================== -->

<div class="bottom-controls">

  <div
    *ngIf="!hideSourceLanguage"
    class="column"
  >
    <input
      [(ngModel)]="filterText"
      (keyup.esc)="filterText2 = ''"
      data-testid="search-source"
      [ngClass]="{ 'input-changed': filterText !== ''}"
      type="text"
      placeholder="Search {{ languageNames['en'] }}"
    >
  </div>

  <div class="column">
    <input
      [(ngModel)]="filterText2"
      (keyup.esc)="filterText2 = ''"
      class="search-translation"
      data-testid="search-target"
      [ngClass]="{ 'input-changed': filterText2 !== '' }"
      type="text"
      placeholder="Search {{ languageNames[login.language] }}"
    >
  </div>

  <div class="column">
    <button
      (click)="reviewNow()"
      class="button-review"
      data-testid="review-action"
      type="button"
    >
      REVIEW
    </button>

    <button
      *ngIf="reviewedOnce"
      (click)="saveEverything()"
      class="button-save"
      data-testid="save-action"
      [disabled]=savingInProgress
      type="button"
    >
      {{ savingInProgress ? 'saving' : 'SAVE' }}
    </button>

  </div>

</div>

<div class="saved-successfully" data-testid="save-banner" *ngIf="saveSuccessShowing">
  SAVED SUCCESSFULLY
</div>

<!-- =========================================================================================== -->

<div class="loading" data-testid="loading-veil" *ngIf="loading">
  LOADING ...
</div>

<!-- =========================================================================================== -->

<div class="overlay" data-testid="login-overlay" *ngIf="!isLoggedIn">

  <div class="login" data-testid="login-panel" [ngClass]="{ 'login-error': loginError }">

    <img src="assets/logo.svg">

    <br><br>

    <span class="label" [ngClass]="{ hidden: !login.name }">
      Name:
    </span>
    <input
      type="text"
      placeholder="Name"
      data-testid="login-name"
      [(ngModel)]="login.name"
      (keyup.enter)=tryLogin()
      [disabled]="waitingForServer"
      autofocus
    >

    <span class="label" [ngClass]="{ hidden: !login.pass }">
      Password:
    </span>
    <input
      class="input-password"
      data-testid="login-pass"
      type="password"
      placeholder="Password"
      [(ngModel)]="login.pass"
      [disabled]="waitingForServer"
      (keyup.enter)=tryLogin()
    >


    <span class="label language">
      Language to edit:
    </span>
    <select data-testid="login-language" (change)="changeLanguage($event.target.value)">
      <option selected="true" disabled="disabled">choose</option>
      <option
        *ngFor="let lang of languageList"
        value="{{ lang }}"
      >
        {{ languageNames[lang] }}
      </option>
    </select>

    <button
      (click)=tryLogin()
      class="button-login"
      data-testid="login-submit"
      [disabled]="!login.name || !login.pass || !login.language || waitingForServer"
    >
      LOGIN
    </button>

  </div>
</div>
