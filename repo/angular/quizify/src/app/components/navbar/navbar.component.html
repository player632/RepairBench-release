<mat-toolbar class="mat-elevation-z1" color="primary">
  <div class="fill-remaining-space" >
  <a  href="">
    <img class="nav-logo" data-testid="nav-logo"  height="40"  src="assets/quizify_logo.svg" alt="Logo Quizify"  />
  </a>
  </div>
  <button mat-button data-testid="create-quiz-btn" (click)="this.router.navigate(['create'])">
    <fa-icon [icon]="faPlus"></fa-icon>
    Create quiz
  </button>
  <button mat-button data-testid="login-button" *ngIf="!isLoggedIn && !isSignInPage" (click)="this.router.navigate(['sign-in'])">
    <fa-icon [icon]="faUser"></fa-icon>
    Log In
  </button>

  <mat-menu #userMenu="matMenu" xPosition="before">
    <ng-template matMenuContent>
      <button mat-menu-item data-testid="menu-profile" (click)="this.router.navigate(['account'])">
        <fa-icon [icon]="faUser"></fa-icon>
        My profile
      </button>
      <button mat-menu-item data-testid="menu-logout" (click)="onSignOut()">
        <fa-icon [icon]="faRightFromBracket"></fa-icon>
        Log Out
      </button>
    </ng-template>
  </mat-menu>
  <button mat-button data-testid="user-menu" *ngIf="isLoggedIn" [matMenuTriggerFor]="userMenu">
    <div matButtonIcon class="profile-image-wrapper">
    <img
      data-testid="nav-avatar"
      class="rounded-circle"
      src="{{
                  getImage() ? getImage() : '/assets/avatars/avatar_00.jpg'
                }}"
      alt="{{ getUsername() }}"
    />
    </div>
  <span data-testid="nav-username">{{ getUsername() }}</span>
  </button>
</mat-toolbar>
