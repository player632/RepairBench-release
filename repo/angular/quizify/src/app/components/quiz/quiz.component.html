

<div class="container dark-background">

  <div class="spinner" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
  </div>
    <mat-card data-testid="quiz-not-found" *ngIf="isQuizNotFound" >
        <a class="logo-wrapper" href="/">
          <img class="logo"  height="70"  src="assets/quizify_logo.svg" alt="Logo Quizify" />
        </a>

        <mat-card-title>{{"Quiz not found"}}</mat-card-title>

        <mat-card-content>

          <div>
            <p>The quiz you're looking for doesn't exist.</p>
          </div>
          <button mat-flat-button class="submit-btn" (click)="this.router.navigate([''])" color="primary">Back to Home</button>
        </mat-card-content>
    </mat-card>
    <mat-card data-testid="quiz-card"  [style]="valueAsStyle" *ngIf="quizService.questionData && !isLoading && !isQuizNotFound">

      <div class="nav-tab">

        <button mat-flat-button data-testid="quiz-back-btn" (click)="back()">
          <fa-icon [icon]="faArrowLeft"></fa-icon>
          Back
        </button>

      <div class="display-timer">

        <button disabled>
          <div class="text" data-testid="quiz-timer">{{quizService.displayTimeElapsed()}}</div>
        </button>
      </div>
      </div>
        <mat-card-header>
            <!-- Question -->
            <mat-card-title-group>
              <mat-card-subtitle><span data-testid="question-subtitle">Question {{quizService.qnProgress}}</span>
              </mat-card-subtitle>
              <mat-card-title><span data-testid="question-title">{{quizService.questionData[quizService.qnProgress].question}}</span>
              </mat-card-title>
            </mat-card-title-group>



        </mat-card-header>
        <mat-card-content *ngIf="quizService.questionData[quizService.qnProgress].options.length">
          <div class="option-buttons-container">
          <button mat-flat-button color="primary" data-testid="option-btn" *ngFor="let option of quizService.questionData[quizService.qnProgress].options let i = index"
                  [value]="i" (click)="selectAnswer(i)">{{option}}</button>
          </div>

        </mat-card-content>

    </mat-card>
</div>
