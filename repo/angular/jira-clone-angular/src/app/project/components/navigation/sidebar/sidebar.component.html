<div data-testid="sidebar"
  [style.width.px]="sidebarWidth"
  class="sidebar">
  <div class="sidebar-content">
    <div class="flex px-1 py-6">
      <j-avatar avatarUrl="[image omitted]%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2748%27 height=%2748%27%3E%3Crect width=%2748%27 height=%2748%27 rx=%276%27 fill=%27%234C6085%27/%3E%3C/svg%3E"
        [name]="'Project'"
        [rounded]="false"
        [size]="45"
        title="Angular Vietnam">
      </j-avatar>
      <div class="pl-2">
        <div class="font-medium text-textDark text-15">
          {{ project.name }}
        </div>
        <div class="text-textMedium text-13">
          {{ project.category }} Project
        </div>
      </div>
    </div>

    @for (link of sideBarLinks; track link; let idx = $index) {
      <div>
        @if (link.url) {
          <a
            [attr.data-testid]="'sidebar-link-' + idx"
            [routerLink]="link.url"
            routerLinkActive="active"
            class="link allowed">
            <svg-icon class="mr-4"
              [name]="link.icon"
              [size]="24">
            </svg-icon>
            <div class="pt-px text-15">{{ link.name }}</div>
          </a>
        }
        @if (!link.url) {
          <div
            class="link not-allowed">
            <svg-icon class="mr-4"
              [name]="link.icon"
              [size]="24">
            </svg-icon>
            <div class="pt-px text-15">{{ link.name }}</div>
            <div class="not-implemented">
              Not implemented
            </div>
          </div>
        }
        @if (idx === 1) {
          <div
          class="divider"></div>
        }
      </div>
    }
  </div>
</div>
