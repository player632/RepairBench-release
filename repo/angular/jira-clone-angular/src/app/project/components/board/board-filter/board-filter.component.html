<div class="flex items-center mt-6">
  <form class="w-40 mr-4">
    <j-input data-testid="board-search"
      aria-label="search"
      icon="search"
      [control]="searchControl">
    </j-input>
  </form>
  <div class="flex flex-row mr-3">
    @for (user of projectQuery.users$ | async; track user) {
      <div
        [attr.data-testid]="'filter-user-' + user.id"
        class="lift-avatar"
        nz-tooltip
        [nzTooltipPlacement]="'bottom'"
        [class.is-active]="isUserSelected(user)"
        [nzTooltipTitle]="user.name">
        <j-avatar class="flex"
          className="select-none shadow-outline-white"
          [avatarUrl]="user.avatarUrl"
          [size]="36"
          (click)="userChanged(user)">
        </j-avatar>
      </div>
    }
  </div>
  <j-button data-testid="filter-only-my-issues"
    class="ml-3"
    className="btn-empty"
    [isActive]="filterQuery.onlyMyIssue$ | async"
    (click)="onlyMyIssueChanged()">
    Only My Issues
  </j-button>
  <j-button data-testid="filter-ignore-resolved"
    class="ml-3"
    [isActive]="filterQuery.ignoreResolve$ | async"
    (click)="ignoreResolvedChanged()"
    className="btn-empty">
    Ignore Resolved
  </j-button>
  @if (filterQuery.any$ | async) {
    <div class="ml-3 flex items-center"
      >
      <div class="mr-3 w-px bg-backgroundMedium self-stretch"></div>
      <j-button data-testid="filter-clear-all" [className]="'btn-secondary'"
        (click)="resetAll()">Clear all
      </j-button>
    </div>
  }
</div>
