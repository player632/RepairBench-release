<div [formGroup]="form" class="number-control">
  <div longPress class="number-left cursor-pointer" data-testid="bpm-dec" (mouseLongPress)="decrementBpm()" (click)="decrementBpm()"></div>
  <input name="bpm" type="number" formControlName="bpm" class="number-quantity large" data-testid="bpm-input" [class.invalid]="!this.form.valid">
  <div longPress class="number-right cursor-pointer" data-testid="bpm-inc" (mouseLongPress)="incrementBpm()" (click)="incrementBpm()"></div>
</div>
