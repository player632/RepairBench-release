<div class="app-container">
  <div class="chat-container" data-rb-transcript>
    <div class="message-container" *ngIf="contents.length === 0 && message === ''" data-rb-welcome>
      <p class="message">
        Welcome to PaLM ChatBot <br />
        Write a text to start.
      </p>
    </div>
    <div
      *ngFor="let content of contents"
      class="chat-message"
      [ngClass]="content.agent + '-message'"
      data-rb-message
    >
      <img [src]="'assets/avatar-' + content.agent + '.png'" class="avatar" data-rb-avatar />
      <div class="message-details">
        <p
          class="message-content"
          [ngClass]="{ loading: content.loading }"
          [innerHTML]="content.message | lineBreak"
          data-rb-content
        ></p>
      </div>
    </div>
  </div>

  <div class="chat-footer-container">
    <mat-form-field class="chat-input">
      <input
        placeholder="Send a message"
        matInput
        #inputMessage
        [(ngModel)]="message"
        (keyup)="sendMessage(message)"
        data-rb-input
      />
    </mat-form-field>
    <button mat-icon-button color="primary" (click)="sendMessage(message)" data-rb-send>
      <mat-icon data-rb-send-icon>send</mat-icon>
    </button>
  </div>
</div>
