<div mat-dialog-content>

</div>
<div mat-dialog-actions style="display: flex; justify-content: center">

    <button mat-raised-button data-testid="camfail-reload-btn" [mat-dialog-close]="CameraErrorDialogResult.TryAgain">Reload</button>
</div>
