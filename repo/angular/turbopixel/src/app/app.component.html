<div class="app-container mat-typography mat-app-background">
    <!-- header -->
    <div class="app-header">
        <mat-toolbar color="primary" style="position: relative;">
            <button mat-button data-testid="hdr-about-btn"
                (click)="clickAbout()" 
                style="position: absolute; left: 8px; font-size: small;">About</button>
            <div class="app-toolbar-center" data-testid="hdr-title-el">
                #{{title}}
            </div>
            <!-- 'window.open("https://www.google.com", "_blank");' -->
            <a href="{{repoLink}}" mat-button target="_blank" data-testid="hdr-repo-link"
                style="position: absolute; right: 8px; font-size: small;">GitHub</a>
        </mat-toolbar>
    </div>
    <!-- content -->
    <div class="app-content">
        <div #contentwrapper class="app-content-wrapper" data-testid="layout-content-wrap">
            <div #image class="app-content-image" data-testid="layout-media-box">
                <video #video class="app-content-video" data-testid="media-video-el"></video>
                <canvas #canvas class="app-content-canvas" data-testid="media-canvas-el"></canvas>
                <mat-spinner class="app-content-spinner" data-testid="boot-spinner-el"
                    *ngIf="state == State.Init || (!hasFrame && State.Work)"></mat-spinner>
            </div>
        </div>
    </div>
    <!-- footer -->
    <div class="app-footer">
        <mat-toolbar color="primary">
            <!-- effect selector -->
            <mat-toolbar-row class="app-toolbar-center" style="display: flex;">
                <button mat-stroked-button [disabled]="state != State.Work" (click)="clickBeforeEffect()" data-testid="nav-prev-btn">
                    <mat-icon aria-label="Before" fontIcon="navigate_next" data-testid="nav-prev-icon-el"></mat-icon>
                </button>
                <button mat-stroked-button style="flex-grow: 1; min-width: 10px;" [disabled]="state != State.Work" data-testid="nav-picker-btn"
                    (click)="clickOpenBottomSheetEffect()"><span class="appicon" data-testid="nav-picker-glyph-el">{{effectIcon(this.effects[this.selectedEffect])}} </span>{{this.effects[this.selectedEffect].title}}</button>
                <button mat-stroked-button [disabled]="state != State.Work" (click)="clickNextEffect()" data-testid="nav-next-btn">
                    <mat-icon aria-label="Next" fontIcon="navigate_next" data-testid="nav-next-icon-el"></mat-icon>
                </button>
            </mat-toolbar-row>
            <!-- effect value -->
            <mat-toolbar-row class="app-toolbar-center" style="display: flex; flex-direction: column;">
                <mat-slider class="app-slider-effect" [disabled]="state != State.Work" min="0" max="1" step="0.00625" data-testid="intensity-slider-el"
                    color="accent">
                    <input matSliderThumb [(ngModel)]="effectValue" data-testid="intensity-slider-input">
                </mat-slider>
            </mat-toolbar-row>
            <!-- buttons -->
            <mat-toolbar-row class="app-toolbar-center" style="grid-template-columns: 1fr repeat(1, auto) 1fr;">
                <button mat-mini-fab [disabled]="state != State.Work" (click)="clickNextCamera()" style="justify-self: start;" data-testid="nav-camswitch-btn">
                    <mat-icon>cameraswitch</mat-icon>
                </button>
                <button mat-fab [disabled]="state != State.Work || !hasFrame" color="warn" (click)="clickTakePhoto()" data-testid="nav-capture-btn">
                    <mat-icon>photo_camera</mat-icon>
                </button>
                <button mat-mini-fab [disabled]="state != State.Work" (click)="clickRandom()" style="justify-self: end;" data-testid="nav-shuffle-btn">
                    <mat-icon>auto_mode</mat-icon>
                </button>
            </mat-toolbar-row>
            <!-- fix bottom -->
            <mat-toolbar-row class="app-toolbar-bottom-fix">
            </mat-toolbar-row>
        </mat-toolbar>
    </div>
</div>

<router-outlet>
</router-outlet>
