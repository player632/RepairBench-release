<h1 mat-dialog-title data-testid="save-title-el">Save Photo</h1>
<div mat-dialog-content>
    <div style="display: flex; justify-content: center">
        <img src={{data.imageUrl}} style="width: 100%; margin-bottom: 8px;" data-testid="save-preview-img">
    </div>
    <!--mat-card style="overflow: auto;"-->
    <button mat-button data-testid="save-caption-btn" 
        (click)="copyDescription()" 
        [matTooltipDisabled]="true" 
        matTooltip="Text Has Been Copied!"
        #copyTooltip="matTooltip"
        style="white-space: pre-line; width: 100%; overflow: hidden; padding: 4px; display: flex; align-items: center; justify-content: center; font-size: x-small; line-height: normal;">
        <div class="selectable">{{data.description}}</div>
    </button>
    <!--/mat-card-->
</div>
<div mat-dialog-actions style="display: flex; justify-content: center">
    <button mat-raised-button color="primary" 
        (click)="clickSave()" data-testid="save-act-download">Save</button>
    <button *ngIf="this.allowCopy" mat-raised-button color="primary"
        (click)="clickCopy()" data-testid="save-act-copy">Copy</button>
    <button *ngIf="this.allowShare" mat-raised-button color="primary"
        (click)="clickShare()" data-testid="save-act-share">Share</button>
</div>
<div mat-dialog-actions style="display: flex; justify-content: center">
    <button mat-raised-button [mat-dialog-close]="SaveDialogResult.Cancel" color="warn" data-testid="save-act-close">Close</button>
</div>
