<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8"/>
  <title>Casual Chess</title>

  <base href="/"/>

  <meta name="color-scheme" content="light dark"/>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="msapplication-tap-highlight" content="no"/>
  <meta name="Description" content="Casual Chess: play chess online. Without clock. Without registration. Free" />
  <meta name="Keywords" content="chess,game,play" />
  <link rel="icon" type="image/png" href="assets/icon/favicon.png"/>
  <link rel="apple-touch-icon" href="assets/icon/favicon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1976d2">
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
<script>
(function () {
  function tagEl(el) {
    if (!el || el.nodeType !== 1) return;
    if (el.tagName === 'PIECE' && el.cgKey) {
      var t = 'pc-' + el.cgKey;
      if (el.getAttribute('data-testid') !== t) el.setAttribute('data-testid', t);
    } else if (el.tagName === 'SQUARE' && el.cgKey) {
      var u = 'sqc-' + el.cgKey;
      if (el.getAttribute('data-testid') !== u) el.setAttribute('data-testid', u);
    }
  }
  function tagRoot(root) {
    if (!root || !root.querySelectorAll) return;
    var i, els = root.querySelectorAll('piece, square');
    for (i = 0; i < els.length; i++) tagEl(els[i]);
  }
  function init() {
    tagRoot(document.body);
    var mo = new MutationObserver(function (muts) {
      for (var k = 0; k < muts.length; k++) {
        tagEl(muts[k].target);
        var added = muts[k].addedNodes;
        for (var a = 0; a < added.length; a++) {
          if (added[a].nodeType === 1) { tagEl(added[a]); tagRoot(added[a]); }
        }
      }
    });
    mo.observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['style', 'class'] });
  }
  if (document.body) init();
  else document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>

</html>
