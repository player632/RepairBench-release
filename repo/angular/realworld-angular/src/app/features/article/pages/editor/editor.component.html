<div class="editor-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-10 offset-md-1 col-xs-12">
        <app-list-errors [errors]="errors()" />

        <form [formGroup]="articleForm">
          <fieldset [disabled]="isSubmitting()">
            <fieldset class="form-group">
              <input
                class="form-control form-control-lg"
                formControlName="title"
                name="title"
                type="text"
                placeholder="Article Title"
                data-testid="editor-title"
              />
            </fieldset>

            <fieldset class="form-group">
              <input
                class="form-control"
                formControlName="description"
                name="description"
                type="text"
                placeholder="What's this article about?"
                data-testid="editor-description"
              />
            </fieldset>

            <fieldset class="form-group">
              <textarea
                class="form-control"
                formControlName="body"
                name="body"
                rows="8"
                placeholder="Write your article (in markdown)"
                data-testid="editor-body"
              >
              </textarea>
            </fieldset>

            <fieldset class="form-group">
              <input
                class="form-control"
                type="text"
                placeholder="Enter tags"
                [formControl]="tagField"
                data-testid="editor-tag-input"
              />
              <div class="tag-list">
                @for (tag of tagList(); track tag) {
                  <span class="tag-default tag-pill" data-testid="editor-tag">
                    <i class="ion-close-round" (click)="removeTag(tag)" [attr.data-testid]="'editor-tag-remove-' + $index"></i>
                    <span [attr.data-testid]="'editor-tag-' + $index">{{ tag }}</span>
                  </span>
                }
              </div>
            </fieldset>

            <button class="btn btn-lg pull-xs-right btn-primary" type="button" (click)="submitForm()" data-testid="editor-publish">
              Publish Article
            </button>
          </fieldset>
        </form>
      </div>
    </div>
  </div>
</div>
