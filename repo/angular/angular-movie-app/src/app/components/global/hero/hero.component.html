<div class="hero">
    <div class="backdrop">
        <div class="lazyloaded">
            <img alt="{{data?.title || data?.name}}" class="lazyload image" data-rb-hero-backdrop
                [src]="'/rb/t/p/original/' + data?.backdrop_path" />
        </div>
    </div>
    <div class="pane">
        <div>
            <h1 class="name" data-rb-hero-name [routerLink]="[data?.name]">
                {{data?.title || data?.name}}
            </h1>
            <div class="meta">
                <div class="rating">
                    <div class="stars">
                        <div data-rb-hero-stars [style.width.%]="data?.vote_average * 100"></div>
                    </div>
                    <div data-rb-hero-reviews *ngIf="data?.vote_count > 0">
                        {{ data?.vote_count | numberWithCommas }} Reviews
                    </div>
                </div>
                <div class="info">
                    <span data-rb-hero-season *ngIf="data?.number_of_seasons">Season {{ data?.number_of_seasons }}</span>
                    <span data-rb-hero-date *ngIf="data?.release_date || data?.first_air_date">{{ data?.release_date
                        || data?.first_air_date | date }}</span>
                </div>
            </div>
            <div class="desc" data-rb-hero-desc>
                {{ data?.overview | truncate }}
            </div>
            <button *ngIf="data.videoId" type="button" class="button button--icon trailer" data-rb-hero-trailer (click)="openTrailer()">
                <span class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="#fff">
                        <path d="M3 22v-20l18 10-18 10z"></path>
                    </svg>
                </span>
                <span class="txt">Watch Trailer</span>
            </button>
        </div>
    </div>
</div>


<app-modal></app-modal>
