<div *ngIf="isVisible" class="modal-backdrop" (click)="closeModal()"></div>
<div *ngIf="isVisible" class="modal-content" data-rb-modal>
    <iframe *ngIf="videoUrl" [src]="videoUrl | safeUrl" data-rb-modal-iframe frameborder="0" allowfullscreen>
    </iframe>
    <button data-rb-modal-close (click)="closeModal()" class="close-button">X</button>
</div>
