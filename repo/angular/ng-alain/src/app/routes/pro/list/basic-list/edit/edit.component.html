<div class="modal-header">
  <div class="modal-title">任务编辑</div>
</div>
<form nz-form (ngSubmit)="save()">
  <nz-form-item>
    <nz-form-label nzRequired>任务名称</nz-form-label>
    <nz-form-control>
      <input data-testid="ble-title" nz-input name="title" [(ngModel)]="record.title" required />
    </nz-form-control>
  </nz-form-item>
  <nz-form-item>
    <nz-form-label>开始时间</nz-form-label>
    <nz-form-control>
      <input data-testid="ble-createdat" nz-input type="date" name="createdAt" [(ngModel)]="record.createdAt" />
    </nz-form-control>
  </nz-form-item>
  <nz-form-item>
    <nz-form-label>任务负责人</nz-form-label>
    <nz-form-control>
      <input data-testid="ble-owner" nz-input name="owner" [(ngModel)]="record.owner" />
    </nz-form-control>
  </nz-form-item>
  <nz-form-item>
    <nz-form-label>产品描述</nz-form-label>
    <nz-form-control>
      <textarea data-testid="ble-desc" nz-input name="subDescription" [(ngModel)]="record.subDescription"></textarea>
    </nz-form-control>
  </nz-form-item>
  <div class="modal-footer">
    <button nz-button type="button" (click)="close()">关闭</button>
    <button data-testid="ble-submit" nz-button type="submit" [nzType]="'primary'" [disabled]="!record.title">保存</button>
  </div>
</form>
