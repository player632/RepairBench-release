<form nz-form [formGroup]="form" (ngSubmit)="_submitForm()">
  <div se-container="1" labelWidth="100">
    <se label="付款账户" required>
      <!-- instrumentation: native select keeps the single-option pay_account control fillable/assertable by the checker -->
      <select data-testid="sf-pay" formControlName="pay_account" class="ant-input">
        <option value=""></option>
        <option [value]="item.pay_account">{{ item.pay_account }}</option>
      </select>
    </se>
    <se label="收款账户" error="请输入收款账户" required>
      <nz-space-compact class="width-100">
        <nz-select data-testid="sf-recv-type" formControlName="receiver_type" style="width: 100px">
          <nz-option [nzLabel]="'支付宝'" [nzValue]="'alipay'" />
          <nz-option [nzLabel]="'银行账号'" [nzValue]="'bank'" />
        </nz-select>
        <input data-testid="sf-recv-account" formControlName="receiver_account" nz-input style="width: calc(100% - 100px)" />
      </nz-space-compact>
    </se>
    <se label="收款姓名" error="请输入收款姓名，至少2个字符以上" required>
      <input data-testid="sf-recv-name" nz-input formControlName="receiver_name" />
    </se>
    <se label="转账金额" error="请输入转账金额，且1至100万以内" required>
      <input data-testid="sf-amount" nz-input formControlName="amount" id="amount" nzAddonAfter="￥" />
    </se>
    <se>
      <button data-testid="sf-next" nz-button nzType="primary" [disabled]="form.invalid">下一步</button>
    </se>
  </div>
</form>
<div class="border-top-1 mt-lg px-lg text-grey-dark">
  <h3 class="h3 my-md">说明</h3>
  <h4 class="h4 mb-sm">转账到支付宝账户</h4>
  <p class="mb-sm">
    如果需要，这里可以放一些关于产品的常见问题说明。如果需要，这里可以放一些关于产品的常见问题说明。如果需要，这里可以放一些关于产品的常见问题说明。
  </p>
  <h4 class="h4 mb-sm">转账到银行卡</h4>
  <p>
    如果需要，这里可以放一些关于产品的常见问题说明。如果需要，这里可以放一些关于产品的常见问题说明。如果需要，这里可以放一些关于产品的常见问题说明。
  </p>
</div>
