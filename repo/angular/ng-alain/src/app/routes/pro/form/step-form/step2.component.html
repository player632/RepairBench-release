<form nz-form [formGroup]="form" (ngSubmit)="_submitForm()">
  <div se-container="1" labelWidth="100">
    <nz-alert class="pb-lg" [nzMessage]="'确认转账后，资金将直接打入对方账户，无法退回。'" [nzShowIcon]="true" [nzCloseable]="true" />
    <se data-testid="sf-pay2" label="付款账户">{{ item.pay_account }}</se>
    <se label="账户类型">{{ item.receiver_type === 'alipay' ? '支付宝' : '银行' }}</se>
    <se label="收款账户"><span data-testid="sf-echo-recv-account">{{ item.receiver_account }}</span></se>
    <se label="收款人姓名"><span data-testid="sf-echo-recv-name">{{ item.receiver_name }}</span></se>
    <se label="转账金额"
      ><strong class="text-lg"><span data-testid="sf-echo-amount">{{ item.amount }}</span></strong></se
    >
    <se label="支付密码" required error="至少6位数以上" class="border-top-1 pt-lg">
      <nz-input-otp data-testid="sf-password" formControlName="password" />
    </se>
    <se>
      <button data-testid="sf-submit2" nz-button [nzType]="'primary'" [nzLoading]="loading" [disabled]="form.invalid">提交</button>
      <button data-testid="sf-prev2" nz-button (click)="prev()">上一步</button>
    </se>
  </div>
</form>
