enableImmutableInstalls: false

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.9.2.cjs

# The pipeline hosts both x64 and ARM64 Windows node runtimes; keep native
# binaries (esbuild/lmdb/msgpackr) for both so installs and builds are
# architecture-agnostic.
supportedArchitectures:
  os:
    - win32
  cpu:
    - x64
    - arm64
