<!DOCTYPE html>

<head>
  <meta charset="utf-8" />
  <script>
    (function () {
      try {
        var valid = { paper: 1, moon: 1, celadon: 1, cinnabar: 1, night: 1, pine: 1 }
        var id = localStorage.getItem('arya_theme')
        if (!valid[id]) id = 'paper'
        var dark = id === 'night' || id === 'pine'
        document.documentElement.setAttribute('data-theme', id)
        document.documentElement.setAttribute('data-scheme', dark ? 'dark' : 'light')
      } catch (e) {}
    })()
  </script>

  <!-- OFFLINE ADAPTATION (RepairBench). Two remote origins used to be referenced here and
       both are gone. Neither removal is a defect and neither is part of the repair task.
       1. fonts.googleapis.com / fonts.gstatic.com - the Inter + Newsreader webfont <link>
          (written across four source lines) and its two preconnect hints are DELETED. Offline
          they are a non-blocking stylesheet failure: every font stack in
          src/assets/styles/variables.less already ends in a generic family, so the chrome falls
          back to the local system sans/serif. No route, no behaviour and no checkpoint in this
          task depends on the webfonts.
       2. www.googletagmanager.com/gtag/js?id=G-TMZBTKHJQM - the async analytics tag is DELETED.
          The inline dataLayer/gtag shim immediately below is KEPT VERBATIM, so window.gtag still
          exists and src/helper/analytics.js trackEvent() still pushes into dataLayer exactly as
          before; only the outbound beacon is gone. -->
  <script>
    window.dataLayer = window.dataLayer || []
    function gtag() {
      dataLayer.push(arguments)
    }
    gtag('js', new Date())

    gtag('config', 'G-TMZBTKHJQM')
  </script>
