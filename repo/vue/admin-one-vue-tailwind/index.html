    <!-- OFFLINE ADAPTATION (repair-bench): the Google Analytics block that stood here (an async

         feeds it) is removed. It is the one real runtime request in the document head, and
         [environment] allow_internet=false forbids it. No file under src/ reads window.dataLayer
         or gtag (grep-verified), so removing both halves changes no application behaviour; the
         og:/twitter: image meta literals below are KEPT - a browser never fetches them, they are
         document metadata, and dropping them would shrink the observable face for no reason. -->
