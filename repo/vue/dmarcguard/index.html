<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parse DMARC - Email Authentication Monitoring</title>
    <meta
      name="description"
      content="Monitor who's sending email on behalf of your domain. Catch spoofing. Stop phishing. DMARC report parser and dashboard."
    />

    <!-- Fonts: the three off-origin Google Fonts links (2 preconnect + 1 stylesheet)
         are removed by the offline adaptation. Nothing else in the seed reaches the
         network at runtime. The visual semantics survive because src/assets/base.css
         already declares a fallback stack for both family custom properties:
         base.css:19 reads font-sans = "Inter", -apple-system, BlinkMacSystemFont,
         sans-serif and base.css:20 reads font-mono = "JetBrains Mono", monospace
         (both lines verified verbatim against the gate clone; only the two named
         webfonts drop out, every generic fallback stays). -->

    <!-- Favicons: re-pointed at the same-origin /favicon.svg landed by the offline
         adaptation. vite.config.js sets publicDir to ./assets, so the icons that live
         in ./public never reach dist/ and all five original links 404 in a built app. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Parse DMARC - Email Authentication Monitoring"
    />
    <meta
      property="og:description"
      content="Monitor who's sending email on behalf of your domain. Catch spoofing. Stop phishing."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Parse DMARC - Email Authentication Monitoring"
    />
    <meta
      name="twitter:description"
      content="Monitor who's sending email on behalf of your domain. Catch spoofing. Stop phishing."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <style>
      /* Critical CSS to prevent flash of unstyled content */
      :root {
        --bg-app: #f8fafc;
      }
      [data-theme="dark"] {
        --bg-app: #0f172a;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: var(--bg-app);
        transition: background-color 0.3s;
      }
    </style>
    <!-- Theme initialization (prevents flash) -->
    <script>
      // Minimal blocking: only use stored preference, defer system preference to later
      (function () {
        var theme = localStorage.getItem("theme");
        if (theme) {
          document.documentElement.setAttribute("data-theme", theme);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
