<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <!-- Repair-Bench offline supply (D). Replaces a remote img.yzcdn.cn default so the
       widget renders with zero network in the graded environment. Same-origin, text,
       and it carries a machine-readable label so a checkpoint can tell slides apart. -->
  <rect width="320" height="200" fill="#c9743b" />
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
        font-family="monospace" font-size="18" fill="#ffffff">rb-offline swipe-2</text>
</svg>
