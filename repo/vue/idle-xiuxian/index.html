<!DOCTYPE html>
<html lang="zh-cmn-Hans">

  <head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
    window.__XX__ = function () {
      var out = { ready: false, error: null };
      try {
        var st = window.__xx_store;
        if (!st || typeof st.gainSpirit !== 'function') return out;
        out.ready = true;
        out.isNewPlayer = st.isNewPlayer;
        out.isGMMode = st.isGMMode;
        out.name = st.name;
        out.level = st.level;
        out.realm = st.realm;
        out.cultivation = st.cultivation;
        out.maxCultivation = st.maxCultivation;
        out.spirit = st.spirit;
        out.spiritRate = st.spiritRate;
        out.luck = st.luck;
        out.cultivationRate = st.cultivationRate;
        out.herbRate = st.herbRate;
        out.alchemyRate = st.alchemyRate;
        out.breakthroughCount = st.breakthroughCount;
        out.totalCultivationTime = st.totalCultivationTime;
        out.itemsFound = st.itemsFound;
        out.pillsCrafted = st.pillsCrafted;
        out.pillsConsumed = st.pillsConsumed;
        out.reinforceStones = st.reinforceStones;
        out.spiritStones = st.spiritStones;
        out.petEssence = st.petEssence;
        out.herbsLen = st.herbs.length;
        out.itemsLen = st.items.length;
        out.activeEffectsLen = st.activeEffects.length;
        out.unlockedRealmsLen = st.unlockedRealms.length;
        out.activePet = st.activePet ? 'active' : 'none';
      out.unlockedPillRecipes = st.unlockedPillRecipes;
      out.wishlistEnabled = st.wishlistEnabled;
      out.completedAchLen = (st.completedAchievements || []).length;
        out.attack = st.baseAttributes.attack;
        out.health = st.baseAttributes.health;
        out.defense = st.baseAttributes.defense;
        out.speed = st.baseAttributes.speed;
      } catch (e) { out.error = String((e && e.message) || e); }
      return out;
    };
    window.__XX_CMD__ = {
      set: function (k, v) { var st = window.__xx_store; if (!(k in st)) return false; st[k] = v; return true; },
      setBase: function (k, v) { var st = window.__xx_store; if (!(k in st.baseAttributes)) return false; st.baseAttributes[k] = v; return true; },
      addHerb: function (id, n) { var st = window.__xx_store; n = n || 1; for (var i = 0; i < n; i++) st.herbs.push({ id: id, name: id, quality: 'common' }); return true; },
      clearHerbs: function () { window.__xx_store.herbs = []; return true; },
      clearEffects: function () { window.__xx_store.activeEffects = []; return true; },
      clearItems: function () { window.__xx_store.items = []; return true; },
      setPillFragment: function (recipeId, n) { window.__xx_store.pillFragments[recipeId] = n; return true; },
      cultivate: function (n) { window.__xx_store.cultivate(n); return true; },
      tryBreakthrough: function () { return window.__xx_store.tryBreakthrough(); },
      gainSpirit: function (n) { window.__xx_store.gainSpirit(n); return true; },
      craftPill: function (recipeId) { var r = window.__xx_store.craftPill(recipeId); return r && r.success === true; },
      gainItem: function (item) { window.__xx_store.gainItem(item); return true; },
      gainPillFragment: function (id) { window.__xx_store.gainPillFragment(id); return true; },
      clearFragments: function () { window.__xx_store.pillFragments = {}; return true; },
      setRecipes: function (arr) { window.__xx_store.pillRecipes = (arr || []).slice(); return true; },
      enhance: function (stones) { var r = window.__XX_EQUIP__ && window.__XX_EQUIP__.enhance({ stats: { attack: 10 }, enhanceLevel: 0 }, stones); window.__xx_enh = r ? { success: r.success === true, cost: typeof r.cost === 'number' ? r.cost : -1 } : null; return true; },
      ui: function (name) { var args = Array.prototype.slice.call(arguments, 1); var fn = window.__XX_UI__ && window.__XX_UI__[name]; return typeof fn === 'function' ? fn.apply(null, args) : '__missing__'; }
    };
    </script>
