<!DOCTYPE html>
<html lang="zh">
  <head>
<% if (process.env.NODE_ENV === 'production') { %>
<!-- Google tag (gtag.js) -->
<!-- environment/adaptation.patch removed the remote analytics script src that used to sit on this line: it was the only construct in this whole tree able to leave the origin at runtime, and it sat inside the EJS production branch opened above, i.e. in exactly the build this task measures. The local window.dataLayer / gtag shim just below is KEPT on purpose, because src/App.vue:250 really does call gtag() inside the successful parse branch (declared at src/shims-vue.d.ts:8), so deleting the whole block would have turned a neutralisation into a ReferenceError on the core surface under test. With the remote src gone those calls push into a plain array and no request is made. html-webpack-plugin strips comments from the production artifact, so this line does not even survive into dist/index.html. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-880H9H1JJT');
</script>
<% } else { %>
<script>
    function gtag() { console.log('gtag', arguments); }
</script>
<% } %>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <link rel="apple-touch-icon" href="<%= BASE_URL %>img/icons/apple-touch-icon.png">
    <link rel="mask-icon" href="<%= BASE_URL %>img/icons/safari-pinned-tab.svg" color="#7F86B2">
    <meta name="msapplication-square150x150logo" content="<%= BASE_URL %>img/icons/mstile-150x150.png">
    <meta name="msapplication-TileColor" content="#7F86B2">
    <title>戴森球计划蓝图预览</title>
  </head>

    </noscript>

    <!-- built files will be auto injected -->
  </body>
</html>
