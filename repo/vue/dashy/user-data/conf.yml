# Harbor Board - local instance configuration
# Pure-local setup: no external services, icons are emoji only.
pageInfo:
  title: Harbor Board
  description: Local homelab dashboard
  footer: Harbor Board - offline demo instance
appConfig:
  theme: callisto
  language: en
  layout: auto
  iconSize: medium
  defaultOpeningMethod: newtab
  statusCheck: false
  enableServiceWorker: false
  disableSmartSort: true
  enableFontAwesome: false
  enableMaterialDesignIcons: false
  enableErrorReporting: false
pages:
  - name: Page Two
    path: page2.yml
sections:
  - name: Everyday
    items:
      - title: Status Probe
        icon: "📡"
        url: http://127.0.0.1:9131/healthz
        localUrl: http://127.0.0.1:9131/healthz
        localUrlCheckInterval: 2
        description: Same-origin health probe
        statusCheck: true
        statusCheckInterval: 2
      - title: Quick Notes
        icon: "🗒"
        url: http://127.0.0.1:9131/minimal
        description: Hotkey quick jump
        hotkey: 7
      - title: Open Target
        icon: "🚀"
        url: /home/page-two
        target: newwindow
        description: Primary launch tile
      - title: Hidden Vault
        icon: "🔒"
        url: /minimal
        description: Stashed away tile
        displayData:
          hideFromHomepage: true
  - name: Archive
    displayData:
      collapsed: true
    items:
      - title: Old Logs
        icon: "📦"
        url: /minimal
        description: Archived logs
