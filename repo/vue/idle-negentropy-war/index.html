<!DOCTYPE html>
<html lang="zh-cmn-Hans">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>熵减战争 - 对抗宇宙熵增的科幻放置游戏</title>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- 统计代码 -->
    <!-- [WLB adaptation] 51.la analytics stripped for offline operation -->
    <script>
    window.__NEG__ = function () {
      var out = { ready: false, error: null };
      try {
        var st = window.__neg_store;
        if (!st || !st.resources) return out;
        out.ready = true;
        out.gameTime = st.gameTime;
        out.civilizationLevel = st.civilizationLevel;
        out.universeState = st.universeState;
        out.isGm = st.isGm;
        out.energy = st.resources.energy;
        out.matter = st.resources.matter;
        out.knowledge = st.resources.knowledge;
        out.darkMatter = st.resources.darkMatter;
        out.coordinateExposure = st.resources.coordinateExposure;
        out.probe = st.explorationres.probe;
        out.relicShard = st.explorationres.relicShard;
        out.alienFragment = st.explorationres.alienFragment;
        out.atomicSorterCount = st.buildings.atomicSorter.count;
        out.atomicSorterLevel = st.buildings.atomicSorter.level;
        out.molecularCoolerUnlocked = st.buildings.molecularCooler.unlocked;
        out.thermalControlUnlocked = st.technologies.thermalControl.unlocked;
        out.atomicProgress = st.entropyReductionStages.atomicOrdering.progress;
        out.energyAchCompleted = st.achievements.energy_achievement.completed;
        out.eventsLen = (st.events || []).length;
        out.cooldownRelic = st.cooldowns.relic || 0;
        out.quantumComputerCount = st.buildings.quantumComputer.count;
        out.stageMaxAtomic = 1000;
      } catch (e) { out.error = String((e && e.message) || e); }
      return out;
    };
    window.__NEG_CMD__ = {
      setResource: function (k, v) { var st = window.__neg_store; if (!(k in st.resources)) return false; st.resources[k] = v; return true; },
      setExplorationRes: function (k, v) { var st = window.__neg_store; if (!(k in st.explorationres)) return false; st.explorationres[k] = v; return true; },
      setBuilding: function (key, count, level, unlocked) { var b = window.__neg_store.buildings[key]; if (!b) return false; if (count != null) b.count = count; if (level != null) b.level = level; if (unlocked != null) b.unlocked = unlocked; return true; },
      setTechUnlocked: function (k, v) { var t = window.__neg_store.technologies[k]; if (!t) return false; t.unlocked = v; return true; },
      setCurrentStage: function (k) { window.__neg_store.currentEntropyStage = k; return true; },
      setStageUnlocked: function (k, v) { var s = window.__neg_store.entropyReductionStages[k]; if (!s) return false; s.unlocked = v; return true; },
      setAchCompleted: function (id, v) { var a = window.__neg_store.achievements[id]; if (!a) return false; a.completed = v; return true; },
      consume: function (k, v) { var st = window.__neg_store; if (!(k in st.resources)) return false; if (st.resources[k] < v) return false; st.resources[k] -= v; return true; },
      tick: function (n) { var st = window.__neg_store; for (var i = 0; i < n; i++) st.updateGame(); return true; },
      build: function (k) { window.__neg_store.buildStructure(k); return true; },
      upgrade: function (k) { window.__neg_store.upgradeBuilding(k); return true; },
      unlockTech: function (k) { window.__neg_store.unlockTechnology(k); return true; },
      reduce: function (n) { window.__neg_store.performEntropyReduction(n); return true; },
      claimAch: function (id) { window.__neg_store.achievements; var svc = window.__neg_ach; if (svc) svc.claimAchievement(id); return true; },
      canUnlockTech: function (k) { return window.__neg_store.canUnlockTech(k); },
      ui: function (name) { var args = Array.prototype.slice.call(arguments, 1); var fn = window.__NEG_UI__ && window.__NEG_UI__[name]; return typeof fn === 'function' ? fn.apply(null, args) : '__missing__'; }
    };
  </script>
  </body>

</html>
