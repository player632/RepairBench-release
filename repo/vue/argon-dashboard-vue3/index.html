<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- RB-OFFLINE (adaptation.patch) STATIC_CDN(3) neutralized: the seed preconnects to
       fonts.googleapis.com and fonts.gstatic.com and then loads the Google Fonts CSS2
       stylesheet for the Open Sans family. The benchmark runs with allow_internet=false,
       so all three remote references are replaced by ONE same-origin stylesheet that
       declares the same family from local() sources only - zero network requests.
       Fallback behaviour is unchanged: with no local Open Sans installed the browser uses
       the generic sans-serif stack, exactly as it does upstream when the CDN is unreachable. -->
  <link href="/rb-assets/fonts.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="msapplication-TileColor" content="#ffffff" />
  <meta name="msapplication-TileImage" content="/ms-icon-144x144.png" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Argon Dashboard - Vue 3</title>
  <meta property="og:title" content="Argon Dashboard - Vue 3" />
  <meta property="og:site_name" content="Argon Dashboard - Vue 3"/>
  <meta property="og:type" content="article"/>
  <!-- RB-OFFLINE (adaptation.patch) EXT_URL_LITERAL neutralized: og:url / og:image carried
           the absolute upstream Firebase Hosting origin. Browsers never fetch Open Graph tags,
           but `vite build` copies them verbatim into dist/index.html, so they are rewritten to
           same-origin paths to keep the built output free of remote references. -->
  <meta property="og:url" content="/" />
  <meta property="og:image" content="/favicon.ico" />
  <meta property="og:description" content="Fullstack tool for building web & mobile apps, complete with UI elements, a Vue frontend and an API-powered backend" />
  
</head>

<body>
  <script>
    /* RB instrumentation probe (instrumentation.patch). Read-only, dependency-free, offline.
       Installed as a CLASSIC inline script ahead of the deferred module entry so it can
       observe boot errors and the resource timeline from the first moment. Exposes a frozen
       window.__rb whose readers all return a SCALAR (string/number/boolean) because
       evaluation/dsl_runner.mjs compares js_eval results with a loose ==, so an object or
       array expectation could never pass. It writes nothing, patches nothing, and creates
       exactly one global: window.__rb itself. */
    (function () {
      var ERR = '__ERR__';
      var errors = [];
      function safe(fn) {
        try { var v = fn(); return (v === undefined || v === null) ? '' : v; }
        catch (e) { return ERR; }
      }
      window.addEventListener('error', function (ev) {
        try { errors.push(String(ev && ev.message ? ev.message : 'error')); }
        catch (e) { errors.push('error'); }
      });
      window.addEventListener('unhandledrejection', function (ev) {
        try { errors.push('unhandledrejection:' + String(ev && ev.reason ? ev.reason : '')); }
        catch (e) { errors.push('unhandledrejection'); }
      });
      function externalResources() {
        var out = 0;
        var list = performance.getEntriesByType('resource') || [];
        for (var i = 0; i < list.length; i++) {
          var name = String(list[i].name || '');
          if (!name) continue;
          if (/^(data|blob|about|filesystem):/i.test(name)) continue;
          var origin = '';
          try { origin = new URL(name, location.href).origin; } catch (e) { origin = ERR; }
          if (origin !== location.origin) out++;
        }
        return out;
      }
      function resourceTotal() {
        var list = performance.getEntriesByType('resource') || [];
        return list.length;
      }
      function rbGlobals() {
        var keep = Object.getOwnPropertyNames(window).filter(function (k) {
          return /^__rb/.test(k) && k !== '__rb';
        });
        keep.sort(); return keep.join('|');
      }
      function storageKeys(which) {
        try { return Object.keys(window[which]).sort().join(String.fromCharCode(124)); }
        catch (e) { return ERR; }
      }
      function ready() {
        var app = document.getElementById('app');
        return !!(app && app.children.length > 0 && document.querySelector('[data-testid]') !== null);
      }
      function domCount(selector) {
        try { return document.querySelectorAll(selector).length; } catch (e) { return -1; }
      }
      function domText(selector) {
        try {
          var e = document.querySelector(selector);
          if (!e) return '';
          var t = (e.innerText === undefined || e.innerText === null) ? e.textContent : e.innerText;
          return String(t).replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
        } catch (e2) { return ERR; }
      }
      window.__rb = Object.freeze({
        boot: Object.freeze({ ready: function () { return safe(ready); } }),
        errors: Object.freeze({
          count: function () { return safe(function () { return errors.length; }); },
          messages: function () { return safe(function () { return errors.join('|'); }); }
        }),
        net: Object.freeze({
          external: function () { return safe(externalResources); },
          total: function () { return safe(resourceTotal); }
        }),
        residue: Object.freeze({
          globals: function () { return safe(rbGlobals); },
          localStorageKeys: function () { return safe(function () { return storageKeys('localStorage'); }); },
          sessionStorageKeys: function () { return safe(function () { return storageKeys('sessionStorage'); }); },
          pathname: function () { return safe(function () { return location.pathname; }); }
        }),
        dom: Object.freeze({
          count: function (s) { return safe(function () { return domCount(s); }); },
          text: function (s) { return safe(function () { return domText(s); }); }
        })
      });
    })();
  </script>
  <div id="app"></div>
  <div id="global-loading" class="overlay hidden">
    <div class="overlay__inner">
      <div class="overlay__content"><span class="spinner"></span></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <!-- RB-OFFLINE (adaptation.patch) EXT_URL_LITERAL neutralized: the seed ships an inline
           <script type="module"> importing firebase-app.js and firebase-analytics.js from
           www.gstatic.com and then calling initializeApp()/getAnalytics() against the upstream
           Firebase project. With allow_internet=false both module imports are unresolvable and
           Analytics would beacon off-box, so the block becomes an import-free, side-effect-free
           stub: SAME call shape, SAME config keys (values neutralized, no host literals), no
           global created, and it throws if it ever stops being inert. Nothing under src/
           imports firebase, so no behaviour under test changes. -->
  <script>
    (function () {
      var firebaseConfig = {
        apiKey: "RB_OFFLINE_NEUTRALIZED",
        authDomain: "RB_OFFLINE_NEUTRALIZED",
        projectId: "RB_OFFLINE_NEUTRALIZED",
        storageBucket: "RB_OFFLINE_NEUTRALIZED",
        messagingSenderId: "0",
        appId: "0",
        measurementId: "G-RBOFFLINE0"
      };
      function initializeApp(_config) { return null; }
      function getAnalytics(_app) { return null; }
      var app = initializeApp(firebaseConfig);
      var analytics = getAnalytics(app);
      if (app !== null || analytics !== null) {
        throw new Error("rb-offline: the firebase stub must stay inert");
      }
    })();
  </script>
</body>

</html>
