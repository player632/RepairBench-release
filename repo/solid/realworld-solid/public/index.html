<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Conduit</title>
    <meta content="width=device-width" name="viewport">
    <!-- RepairBench offline adaptation. The five upstream external references are gone so
         this package builds, serves and is measured with zero network access:
           1. //code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css
           2. //fonts.googleapis.com/css?family=Titillium+Web...  (4 families)
           3. //demo.productionready.io/main.css                  (the Conduit Bootstrap theme)
           4. //demo.productionready.io/favicon.ico
           5. three <link rel="preconnect"> hints (static.productionready.io,
              api.realworld.io, code.ionicframework.com)
         The self-contained fallback theme below supplies the class names the app renders.
         Measurement reads structure / text / class names only — never an external glyph,
         font metric or computed style — so removing the CDN cannot change a verdict.
         The API itself is mocked in-package at src/store/mock/ (see createAgent.js). -->
    <link
      rel="shortcut icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%235cb85c'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3EC%3C/text%3E%3C/svg%3E"
    />
    <style>body{min-height: 101vh;}</style>
    <style>
      /* ---- fallback theme (self-contained; replaces the upstream hosted Conduit theme,
          whose five external references are itemised in the head comment above) ---- */
      *, *::before, *::after { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-size: 16px; line-height: 1.5; color: #373a3c; background-color: #fff;
      }
      h1, h2, h3, h4 { font-family: "Titillium Web", "Segoe UI", Arial, sans-serif; margin: 0 0 .5rem; }
      a { color: #5cb85c; text-decoration: none; }
      a:hover { color: #3d8b3d; text-decoration: underline; }
      ul { list-style: none; margin: 0; padding: 0; }
      .container { max-width: 1140px; margin: 0 auto; padding: 0 15px; }
      .row { display: flex; flex-wrap: wrap; margin: 0 -15px; }
      .col-md-3, .col-md-6, .col-md-8, .col-md-9, .col-md-10, .col-xs-12 { padding: 0 15px; width: 100%; }
      @media (min-width: 768px) {
        .col-md-3 { width: 25%; } .col-md-6 { width: 50%; } .col-md-8 { width: 66.6667%; }
        .col-md-9 { width: 75%; } .col-md-10 { width: 83.3333%; }
        .offset-md-1 { margin-left: 8.3333%; } .offset-md-2 { margin-left: 16.6667%; }
        .offset-md-3 { margin-left: 25%; }
      }
      .text-xs-center { text-align: center; }
      .pull-xs-right { float: right; }
      /* navbar */
      .navbar { padding: .5rem 0; background: #fff; border-bottom: 1px solid rgba(0,0,0,.08); }
      .navbar-light .navbar-brand, .navbar-brand { font-family: "Titillium Web", Arial, sans-serif;
        font-size: 1.5rem; color: #5cb85c; font-weight: 700; }
      .navbar-nav { display: flex; align-items: center; }
      .nav-item { margin-left: .75rem; }
      .nav-link { color: rgba(0,0,0,.3); font-weight: 600; }
      .nav-link:hover { color: rgba(0,0,0,.5); text-decoration: none; }
      .nav-link.active, .nav-pills .nav-link.active, .outline-active .nav-link.active {
        color: #373a3c; border-bottom: 2px solid #5cb85c; }
      /* banner + home */
      .banner { background: #373a3c; color: #fff; padding: 2rem 0; margin-bottom: 1.5rem; }
      .banner h1.logo-font, .logo-font { font-family: "Titillium Web", Arial, sans-serif;
        font-weight: 700; letter-spacing: .05em; text-transform: lowercase; }
      .banner h1 { font-size: 3rem; margin: 0; }
      .banner p { margin: 0; color: #ddd; }
      .home-page .banner { background: #5cb85c; }
      .page { padding-top: 1.5rem; }
      .feed-toggle { margin-bottom: 1.5rem; border-bottom: 1px solid rgba(0,0,0,.08); }
      .nav-pills .nav-link { display: inline-block; padding: .5rem 1rem; border: 1px solid transparent;
        border-radius: .25rem .25rem 0 0; color: #aaa; }
      .outline-active .nav-link.active { border: 1px solid #ddd; border-bottom-color: #fff; background: #fff; color: #5cb85c; }
      /* sidebar + tags */
      .sidebar { padding: .8rem 1rem; background: #f3f3f3; border-radius: .25rem; }
      .sidebar p { margin: 0 0 .5rem; font-weight: 600; }
      .tag-list { display: flex; flex-wrap: wrap; margin: 0 -.2rem; }
      .tag-pill, .tag-default { display: inline-block; margin: .2rem; padding: .15rem .6rem;
        background: #818a91; color: #fff; border-radius: 1rem; font-size: .8rem; cursor: pointer; }
      .tag-outline { background: transparent; border: 1px solid #aaa; color: #aaa; }
      .tag-pill:hover, .tag-default:hover { background: #687077; color: #fff; text-decoration: none; }
      /* buttons */
      .btn { display: inline-block; padding: .375rem .75rem; font-size: 1rem; line-height: 1.5;
        text-align: center; white-space: nowrap; vertical-align: middle; cursor: pointer;
        border: 1px solid transparent; border-radius: .25rem; user-select: none; }
      .btn:hover { text-decoration: none; }
      .btn-sm { padding: .25rem .5rem; font-size: .875rem; border-radius: .2rem; }
      .btn-lg { padding: .75rem 1.5rem; font-size: 1.25rem; }
      .btn-primary { background-color: #5cb85c; border-color: #5cb85c; color: #fff; }
      .btn-primary:hover { background-color: #449d44; border-color: #419641; color: #fff; }
      .btn-outline-primary { background-color: transparent; border-color: #5cb85c; color: #5cb85c; }
      .btn-outline-primary:hover { background-color: #5cb85c; color: #fff; }
      .btn-outline-secondary { background-color: transparent; border-color: #ccc; color: #aaa; }
      .btn-outline-secondary:hover { border-color: #aaa; color: #555; }
      .btn-outline-danger { background-color: transparent; border-color: #b85c5c; color: #b85c5c; }
      .btn-outline-danger:hover { background-color: #b85c5c; color: #fff; }
      /* article preview cards */
      .article-preview { padding: 1.5rem 0; border-top: 1px solid rgba(0,0,0,.08); }
      .article-meta { display: flex; align-items: center; margin-bottom: .75rem; }
      .article-meta .user-img, .user-img, .comment-author-img { width: 32px; height: 32px;
        border-radius: 50%; background: #ddd; display: inline-block; }
      .article-meta .info, .info { margin: 0 1.5rem 0 .3rem; }
      .article-meta .author, .author { display: block; color: #5cb85c; font-weight: 600; }
      .article-meta .date, .date, .date-posted { display: block; color: #bbb; font-size: .8rem; }
      .article-preview .preview-link { color: inherit; }
      .article-preview .preview-link:hover { text-decoration: none; color: inherit; }
      .article-preview h1, .article-preview .card-text { font-size: 1.5rem; font-weight: 600; margin: 0 0 .5rem; }
      .article-preview p { margin: 0 0 .75rem; color: #666; }
      .article-preview span, .article-preview .article-meta { font-size: .8rem; color: #bbb; }
      .article-content p { margin: 0 0 1rem; }
      .action-btn { margin-left: .5rem; }
      /* pagination */
      .pagination { display: flex; margin: 1.5rem 0; }
      .page-item { margin: 0 -1px 0 0; }
      .page-link { display: block; padding: .5rem .75rem; border: 1px solid #ddd; color: #5cb85c; background: #fff; }
      .page-item.active .page-link { background: #5cb85c; border-color: #5cb85c; color: #fff; }
      .page-item .page-link:hover { background: #eceeef; text-decoration: none; }
      /* article page */
      .article-page .banner { background: #333; }
      .article-page .article-actions, .article-actions, .mod-options { margin: 1rem 0; text-align: center; }
      .article-page .card, .card { border: 1px solid #e5e5e5; border-radius: .25rem; background: #fff; }
      .card-block { padding: 1.25rem; }
      .card-footer { padding: .75rem 1.25rem; border-top: 1px solid #e5e5e5; background: #f5f5f5; }
      .card-text { margin: 0; }
      /* comments */
      .comment-form textarea.form-control { width: 100%; }
      .card .comment-author, .comment-author { color: #5cb85c; font-weight: 600; }
      /* forms + auth/settings/editor/profile */
      .form-group { margin-bottom: 1rem; }
      .form-control { display: block; width: 100%; padding: .5rem .75rem; font-size: 1rem;
        line-height: 1.25; color: #55595c; background-color: #fff;
        border: 1px solid rgba(0,0,0,.15); border-radius: .25rem; }
      .form-control:focus { border-color: #66afe9; outline: none; }
      .form-control-lg { padding: .75rem 1.5rem; font-size: 1.25rem; }
      textarea.form-control { min-height: 6rem; }
      .auth-page, .settings-page, .editor-page, .profile-page { padding-top: 1.5rem; }
      .error-messages { color: #b85c5c; margin-bottom: 1rem; }
      .error-messages li { list-style: none; }
      .user-info { text-align: center; margin: 1rem 0 1.5rem; }
      .user-info h4 { margin: .5rem 0 .25rem; }
      .articles-toggle { margin-bottom: 1.5rem; }
      /* ion-* icons: the upstream icon font is gone. Keep a fixed inline box so layout and
         text nodes around it are unchanged, and render no glyph. */
      [class^="ion-"], [class*=" ion-"] { display: inline-block; width: 1em; height: 1em;
        line-height: 1; vertical-align: -.125em; }
      .articles-loading, .loading { text-align: center; padding: 2rem 0; color: #aaa; }
    </style>
  </head>
  <body>
    <script type="module" src="./index.js"></script>
  </body>
</html>
