<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hlviewer.js - RepairBench demo entry</title>
    <!--
      
      This seed ships NO application page: it is a library (vite build.lib -> dist/hlviewer.js
      ES + dist/hlviewer.min.js UMD) and the root index.html in the gate clone is a vite DEV
      page whose module src is "/src/index.ts" (source, not a build product), so it cannot be
      served from a production build at all.
      Constraints honoured here:
        
            is 0 bytes changed;
        (2) it imports ONLY build products (./dist/hlviewer.js and ./dist/hlviewer.js.css) and
            contains 0 lines of tested logic - the three calls below are the seed's own documented
            public API, byte-for-byte the same calls the shipped dev page makes;
        (3) 0 remote resources: no CDN, no webfont, no analytics. System font stack only.
      
      
      and evaluation/serve_static.mjs:30 answers 403 to any path outside - -dir, so an outdir of
      "dist" would leave the runtime data in res/ (map/replay/sky/sound, 17 MB, gitignored but
      
      {node_modules,.git}) unreachable.
    -->
    <link rel="stylesheet" href="./dist/hlviewer.js.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #202020;
        font-family: Tahoma, Verdana, sans-serif;
        color: #ddd;
      }
      .rb-wrap {
        width: 960px;
        margin: 24px auto;
      }
      /* Fixed pixel box: the viewer derives its camera aspect and its drawing buffer from
         #hlv-target's client size (Game.draw), so a fixed box keeps every reading
         machine-independent. */
      #hlv-target {
        position: relative;
        width: 960px;
        height: 600px;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="rb-wrap">
      <div id="hlv-target"></div>
    </div>

    <script type="module" src="./dist/hlviewer.js"></script>
    <script type="module">
      const viewer = HLViewer.init('#hlv-target', 'res')
      viewer.load('kz_ea_highblock.dem')
      viewer.setTitle('Cupe on kz_ea_highblock done in 02:32.95')
    </script>
  </body>
</html>
