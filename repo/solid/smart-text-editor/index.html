<!DOCTYPE html>
<html lang="en-US">

<head>

<title>Smart Text Editor</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="author" content="Brandon Bennett">
<meta name="description" content="Smart Text Editor is a vanilla JavaScript PWA that allows you to work on your coding projects from any device, in any browser, even if you don't have Internet access.">
<meta property="og:title" content="Smart Text Editor">
<meta property="og:description" content="The text editor that requires only a browser and a keyboard!">
<meta property="og:image" content="./img/share-1200.png">
<meta property="og:url" content="https://stedit.app">
<meta name="twitter:card" content="summary_large_image">
<meta id="theme_color" name="theme-color" content="#1e1e1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Text Editor">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<base href="./" target="_blank">
<link rel="canonical" href="https://stedit.app">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./img/icon.svg">
<link rel="alternate icon" type="image/png" sizes="16x16" href="./img/icon-16.png">
<link rel="alternate icon" type="image/png" sizes="32x32" href="./img/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./img/app-apple-touch-180.png">
<link rel="apple-touch-icon" sizes="1024x1024" href="./img/app-apple-touch-1024.png">
<!-- RepairBench adaptation: the webfont stylesheet and its preconnect were remote
     (fonts.googleapis.com / fonts.gstatic.com). src/index.scss:18-19 already declares local
     fallbacks for both stacks (-apple-system / ui-monospace), so this is cosmetic only. -->
<link rel="preload" as="fetch" crossorigin href="./vendor/num-text/styles/vanilla-layout.css">
<link rel="preload" as="fetch" crossorigin href="./vendor/num-text/styles/vanilla-appearance.css">
<link rel="preload" as="fetch" crossorigin href="./vendor/num-text/styles/vanilla-highlighting.css">
<!-- RepairBench adaptation: both custom-element bundles were remote (cdn.jsdelivr.net). They are
     vendored from the app's own dependencies (@stedit/num-text 1.0.1, @stedit/menu-drop 1.1.0 - the
     version the URL pinned). Each package resolves its own stylesheets as ../styles/* relative to
     document.currentScript.src (num-text dist/index.js:85-97, menu-drop dist/index.js:269), so the
     dist/ + styles/ sibling layout is load-bearing for both. -->
<script src="./vendor/num-text/dist/index.js"></script>
<script src="./vendor/menu-drop/dist/index.js"></script>

<script>
  if (window.self === window.top){
    document.documentElement.classList.add("startup-fade");
  }
</script>

<link rel="stylesheet" href="./src/index.scss">

<style id="scrollbar_styles">
  ::-webkit-scrollbar {
    width: var(--scrollbar-width);
    height: var(--scrollbar-height);
  }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner {
    background: none;
  }
  ::-webkit-scrollbar-thumb {
    width: 36px;
    height: 36px;
    background: #808080;
    background-clip: content-box;
    border: var(--scrollbar-border-width) solid transparent;
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background-color: #a0a0a0;
  }
</style>

<style id="theme_styles"></style>

</head>

<body class="code horizontal" data-view="code" data-orientation="horizontal" ontouchstart>

<div id="root"></div>

<script type="module" src="./src/index.tsx"></script>

</body>

</html>
