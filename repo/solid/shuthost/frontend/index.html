<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A neat helper that manages the standby state of unix and windows hosts with Wake-On-Lon (WOL) configured, with Web-GUI." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0b6b3a" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2ec164" />
    <meta name="background-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="background-color" media="(prefers-color-scheme: dark)" content="#0b0f12" />
    <link rel="icon" href="/favicon.3db9db20.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/generated/app.css" />
    <script id="build-data" type="application/json">{
        "stylesHash": "static",
        "stylesIntegrity": "unused",
        "manifestHash": "static",
        "iconHashes": {},
        "svgHashes": {
            "favicon": "3db9db20"
        },
        "description": "A neat helper that manages the standby state of unix and windows hosts with Wake-On-Lon (WOL) configured, with Web-GUI.",
        "repository": "https://github.com/9SMTM6/shuthost",
        "version": "1.9.5",
        "appJsHash": "static",
        "appJsIntegrity": "unused"
    }</script>
    <script id="server-data" type="application/json">{
        "configPath": "/etc/shuthost/shuthost_coordinator.toml",
        "authWarning": false,
        "demoSubpath": "",
        "authMode": "token",
        "broadcastPort": 9001,
        "dbEnabled": true
    }</script>
    <script type="module" defer src="/src/generated/app.js"></script>
</head>

<body>
<noscript>
    <div id="noscript-warning" class="alert alert-error mb-4" role="alert">
        <strong class="alert-title">Error!</strong>
        <p>This application requires JavaScript to function properly. Please enable JavaScript in your browser settings
            and reload the page.</p>
    </div>
</noscript>
<div id="app"></div>
</body>

</html>
