<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="user-scalable=yes, width=device-width, initial-scale=1.0" />

    <!-- RepairBench adaptation AD-1 (offline-ization). The CDN <script> that stood here
         (https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js) was this page's only runtime dependency on a
         remote host. It is replaced by vendor/vue.js, a BYTE-FOR-BYTE copy of the Vue
         build this very repository already ships at "Mac OS app/Minimal Notes.app/
         Contents/Resources/www/vue.js" (Vue.js v2.5.16, full build - it carries the
         in-DOM template compiler these pages need, MIT licensed). The framework the app
         is written against is therefore unchanged and nothing is mocked or substituted:
         the measured surface stays this page's own Vue instance. Static check after
         the change: index.html retains no off-origin reference whatsoever. -->
    <script src="vendor/vue.js"></script>

    <title>Minimal Notes</title>

    <link rel="icon" sizes="192x192" href="icon.png">

    <style>
        /* RepairBench adaptation AD-2 (offline-ization). The remote Montserrat @import that
           stood here (https://fonts.googleapis.com/css?family=Montserrat) was decorative
           typography only: body { font-family: "Montserrat" } falls back to the browser's
           default face when the sheet is absent, and no note-taking behaviour on index.html
           reads a font metric, a glyph box or a computed text width. Removed so the page
           makes zero requests off this origin. */

        body {
            font-family: "Montserrat";
            /* font: 14px/1.6'Avenir', Helvetica, Arial, sans-serif; */
        }
        i {
            font-size: 12px;
            clear: both;
            font-style: normal;
            display: block;
        }
        h2 {
            margin: 10px
        }
        #app {
            display: flex;
            flex-flow: column wrap;
            margin: 0 auto;
            height: 600px;
            justify-content: flex-start;
            align-content: flex-start;
        }
        #app > * {
            border-radius: 2px;
            transition: all ease 0.3s;
        }
        #app>div {
            position: relative;
            width: 200px;
            padding: 8px;
            margin: 10px;
            border: 1px solid #ccc;
        }
        
        textarea {
            display: block;
            max-width: 200px;
            padding: 8px;
            margin: 10px;
            border: 1px solid #ccc;
        }
        textarea:focus {
            border-color: black;
        }
        button {
            padding: 0;
            cursor: pointer;
            background: transparent;
            border: 0;
            -webkit-appearance: none;
        }
        .button {
            display: block;
            box-sizing: content-box;
            width: 200px;
            padding: 8px;
            margin: 0 10px 20px 10px;
            border: 1px solid #ccc;
            cursor: pointer;
            clear: both;
        }
        .button:hover {
            background-color: black;
            color: white;
            border-color: black;
        }
        .top {
            text-align: right;
            display: flex;
            flex-direction: row-reverse;
            justify-content: space-between;
            margin-bottom: 0.5em;
        }
        
        .close {
            text-align: right;
            height: 10px;
            width: 10px;
            position: relative;
            box-sizing: border-box;
            line-height: 10px;
            display: inline-block;
        }
        .close:before, .close:after {
            transform: rotate(-45deg);
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -1px;
            margin-left: -5px;
            display: block;
            height: 2px;
            width: 10px;
            background-color: black;
            transition: all 0.25s ease-out;
        }
        .close:after {
            transform: rotate(-135deg);
        }
        .close:hover:before, .close:hover:after {
            transform: rotate(0deg);
        }


    </style>
</head>

<body>
    <div id="app" data-testid="mn-a-app">

        <h2 data-testid="mn-a-title">{{title}}</h2>

        <textarea autofocus placeholder="insert your note .." data-testid="mn-a-composer" v-model="note.text"></textarea>

        <button class="button" data-testid="mn-a-submit" @click="addNote">Submit</button>

        <div data-testid="mn-a-card" v-for="(note, index) in notes">
            <div class ="top">
                <button class="close" :data-testid="'mn-a-close-'+index" @click="removeNote(index)"></button>
                <i data-testid="mn-a-date">{{note.text}}</i>
            </div>
            {{note.date}}
        </div>
    </div>
    <script src="rb-probe.js"></script>
    <script>
        var app = new Vue({
            el: '#app',
            data: {
                title: 'Minimal Notes',
                note: {
                    text: '',
                    date: ''
                },
                notes: [{
                    text: 'Minimal Notes',
                    date: new Date(Date.now()).toLocaleString()
                }]
            },
            methods: {
                addNote() {
                    let {
                        text, title, color
                    } = this.note
                    if (text === null) {
                       return;
                    }
                    this.notes.push({
                        text,
                        date: new Date(Date.now()).toLocaleString(),
                    })
                },
                removeNote(index) {
                    this.$delete(this.notes, this.notes.length - 1)
                },

            },
            mounted() {
                if (localStorage.getItem('notes')) this.notes = JSON.parse(localStorage.getItem('notes'));
            },
            watch: {
                notes: {
                    handler() {
                        localStorage.setItem('note', JSON.stringify(this.notes));
                    },
                    deep: true,
                },
            }
        })
    </script>
</body>

</html>
