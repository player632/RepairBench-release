<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>贪吃蛇</title>
    <link href="css/tetris.css" type="text/css" rel="stylesheet">
    <meta name="keywords" content="贪食蛇，原生javascript，javascript实现贪吃蛇">
    <meta name="description" content="原生javascript编写贪吃蛇">
    <link rel="icon" href="img/Snake.png">
</head>
<body>
<div class="content" data-testid="content">
    <table id="chessboard" data-testid="chessboard"></table>
    <div class="right" data-testid="side-panel">
        <div class="rules">
            <div class="title">
                <span>用户名：</span>
                <span class="edit" data-testid="edit-entry">编辑</span>
            </div>
            <div class="score name" data-testid="user-name">0</div>
        </div>
        <div class="rules">
            <div class="title">得分：</div>
            <div class="score" data-testid="score-value">0</div>
        </div>
        <div class="rules">
            <div class="title">
                <span>用时：</span>
                <span class="unit">(秒)</span>
            </div>
            <div class="score time" data-testid="time-value">0</div>
        </div>
        <div class="rules">
            <div class="title">游戏规则：</div>
            <!-- <p>按任意方向键，开始游戏，通过吃蛋获取得分。</p> -->
            <p data-testid="rule-text">使用方向键，控制蛇吃蛋得分。</p>
        </div>
        <div class="rules">
            <div class="title">英雄榜：</div>
            <div class="ranking" data-testid="ranking">
                <p>
                    <span class="user-name">比克大魔王</span>：
                    <span class="score-num">230分</span>
                </p>
                <p>
                    <span class="user-name">张可</span>：
                    <span class="score-num">120分</span>
                </p>
                <p>
                    <span class="user-name">王耀辉</span>：
                    <span class="score-num">100分</span>
                </p>
                <p>
                    <span class="user-name">我是第一</span>：
                    <span class="score-num">100分</span>
                </p>
                <p>
                    <span class="user-name">多啦A梦</span>：
                    <span class="score-num">120分</span>
                </p>
            </div>
        </div>
    </div>
</div>

<!--弹窗-->
<div class="wrapper" data-testid="dialog-overlay">
    <div class="dialog-box" data-testid="dialog-box">
        <div class="box-header" data-testid="dialog-header">
            编辑用户名
        </div>
        <div class="head-button" data-testid="dialog-close-icon">
            <img src="img/cancel.png">
        </div>
        <div class="box-content" data-testid="dialog-content">
            大侠可留下你的昵称，冲刺最高记录
            <div class="sq-input" data-testid="nickname-field-wrap">
                <input data-testid="nickname-input">
            </div>
        </div>
        <div class="box-btns">
            <button class="leave-Message" data-testid="btn-leave-message">我要吐槽</button>
            <button class="skip" data-testid="btn-skip">跳过</button>
            <button class="adminUrl" data-testid="btn-records">游戏记录</button>
            <button class="conform" data-testid="btn-confirm">确认</button>
        </div>
    </div>
</div>

<script src="js/snake.js"></script>
<script src="js/messageBox.js"></script>
<!-- RepairBench offline stand-in: in-tree replacement for the three unreachable upstream endpoints and for the three off-site window.open targets. Loaded here (after messageBox.js, before index.js) so it can patch MessageBox.prototype.myAjax before the page boots. See environment/adaptation.patch and meta.json.patch_ledger.adaptation_note. -->
<script src="rb-offline/api.js"></script>
<script src="js/index.js"></script>
</body>
</html>
