<script>
const debugImage = true
const debugRect = false
const canvas = document.getElementById('myCanvas')
const ctx = canvas.getContext('2d')

const farmBG = document.querySelector('#farm-bg')
const cow = document.querySelector('#cow')
const farmerSprite = document.querySelector('#farmer')
const lasershot = document.querySelector('#lasershot')
const meteor = document.querySelector('#meteor')
const fragment = document.querySelector('#fragment')
const explosion = document.querySelector('#explosion')

let soundsLoaded = false
let deploy
let gun_sfx
let yeehaw_sfx
let bluegrass_sfx
let explosion_sfx
let moo_sfx

const muteButton = document.querySelector('#mute-button')
muteButton.addEventListener('click', () => {
  if (bluegrass_sfx.volume === .5) {
    bluegrass_sfx.volume = 0
  } else {
    bluegrass_sfx.volume = 0
  }
})
let rightAimPressed = 0
let leftAimPressed = 0
let rightPressed = 0
let leftPressed = 0
let upPressed = 0
let enterPressed = 0

document.addEventListener('keydown', keyDownHandler, false)
document.addEventListener('keyup', keyUpHandler, false)

function keyDownHandler (e) {
  if (e.code === 'ArrowRight') rightAimPressed = 1
  if (e.code === 'ArrowLeft') leftAimPressed = 1
  if (e.code === 'ArrowUp' || e.code === 'Space') upPressed = 1
  if (e.code === 'KeyD') rightPressed = 1
  if (e.code === 'KeyA') leftPressed = 1
  if (e.code === 'Enter') enterPressed = 1
}

function keyUpHandler (e) {
  if (e.code === 'ArrowRight') rightAimPressed = 0
  if (e.code === 'ArrowLeft') leftAimPressed = 0
  if (e.code === 'ArrowUp' || e.code === 'Space') upPressed = 0
  if (e.code === 'KeyD') rightPressed = 0
  if (e.code === 'KeyA') leftPressed = 0
  if (e.code === 'Enter') enterPressed = 0
}

function getRandomInt (min, max) {
  min = Math.ceil(min)
  max = Math.floor(max)
  return Math.floor(Math.random() * (max - min)) + min //The maximum is exclusive and the minimum is inclusive
}

// --UI -- //

const drawText = (ctx, options) => {
  const { text, x, y, fontSize, horizontalPadding, verticalPadding, hAlignment, vAlignment } = options;

  ctx.font = `${fontSize}px Broken Console`;

  // Calculate text dimensions
  const textMetrics = ctx.measureText(text);
  const buttonWidth = textMetrics.width + 2 * horizontalPadding;
  const buttonHeight = textMetrics.actualBoundingBoxAscent + textMetrics.actualBoundingBoxDescent + 2 * verticalPadding;

  // Adjust x based on hAlignment or specific value
  let adjustedX;
  if (typeof x !== 'undefined') {
    adjustedX = x;
  } else {
    if (hAlignment === 'center') {
      adjustedX = (ctx.canvas.width - buttonWidth) / 2;
    } else if (hAlignment === 'right') {
      adjustedX = ctx.canvas.width - buttonWidth;
    } else { // Default to 'left'
      adjustedX = 0;
    }
  }

  // Adjust y based on vAlignment or specific value
  let adjustedY;
  if (typeof y !== 'undefined') {
    adjustedY = y;
  } else {
    if (vAlignment === 'middle') {
      adjustedY = (ctx.canvas.height - buttonHeight) / 2;
    } else if (vAlignment === 'bottom') {
      adjustedY = ctx.canvas.height - buttonHeight;
    } else { // Default to 'top'
      adjustedY = 0;
    }
  }

  // Draw button background
  ctx.fillStyle = 'transparent';
  ctx.fillRect(adjustedX, adjustedY, buttonWidth, buttonHeight);

  // Set up stroke properties
  ctx.strokeStyle = 'black'; // set the stroke color
  ctx.lineWidth = 0;         // set the stroke width

  // Draw text
  ctx.fillStyle = 'white';
  ctx.fillText(
    text,
    adjustedX + horizontalPadding,
    adjustedY + verticalPadding + textMetrics.actualBoundingBoxAscent
  );

  // Stroke the text
  // ctx.strokeText(
  //     text,
  //     adjustedX + horizontalPadding,
  //     adjustedY + verticalPadding + textMetrics.actualBoundingBoxAscent
  // );

  // Check if hAlignment is used and update startButton's x if it is
  if (typeof x === 'undefined' && hAlignment) {
    options.x = adjustedX; // Update the x value in startButton
  }

  // Check if vAlignment is used and update startButton's y if it is
  if (typeof y === 'undefined' && vAlignment) {
      options.y = adjustedY; // Update the y value in startButton
  }

  // Update width and height always
  options.width = buttonWidth;
  options.height = buttonHeight;

  // Return button dimensions for click detection
  return {
    x: adjustedX,
    y: adjustedY,
    width: buttonWidth,
    height: buttonHeight
  };
}

// ----- Game ------ // 

const GAME_WIDTH = canvas.width
const GAME_HEIGHT = canvas.height

const textures = [
  '#000000',
  '#8e44ad',
  '#e67e22',
  '#f1c40f', // yellow
  '#7f8c8d' // dark gray
]

const COWS_MAX = 4
const METEORS_MAX = 50
const PARTICLES_MAX = 100
const BULLETS_MAX = 100

let farmer
let house
let crop
let gun
let cowsLeft = []
let bullets = []
let meteors = []
let particles = []
let score = 0

function collision (a, b) {
  const xcollide = (a.x + a.w) >= b.x && a.x < (b.x + b.w)
  const ycollide = (a.y + a.h) >= b.y && a.y < (b.y + b.h)
  return xcollide && ycollide
}

function degreesToRadians(degrees) {
  return degrees * (Math.PI / 180)
}

function endpoint(cx, cy, r, theta) {
  let x = cx + r * Math.cos(theta)
  let y = cy + r * Math.sin(theta)
  return {x, y}
}


function drawRect (x, y, w, h, t, deg, img) {
  if (t) ctx.fillStyle = textures[t]
  if (deg) {
    ctx.save()
    ctx.translate((x + (w / 2)), y + h)
    ctx.rotate(deg * Math.PI / 180)
    ctx.translate(-(x + (w / 2)), -(y + h))
  }

  if (img) {
    ctx.drawImage(img, x, y, w, h)
  } else {
    ctx.fillRect(x, y, w, h)
  }

  ctx.restore()
}

function updateFarmer () {
  farmer.speed_x = (leftPressed || rightPressed) ? (leftPressed ? -5 : 5) : farmer.speed_x
  farmer.x += farmer.speed_x
}

function updateGun () {
  if (gun.can_fire > 0) gun.can_fire--

  if (rightAimPressed) gun.deg -= gun.deg < 90 ? 3 : 0
  if (leftAimPressed) gun.deg += gun.deg > -90 ? 3 : 0

  gun.x = farmer.x + (farmer.w / 2) - (gun.w / 2)
  gun.y = farmer.y - farmer.h - 70
}

function fireBullet () {
  if (gun.can_fire > 0) return

  const bulletWidth = 10
  const bulletHeight = 10

  gun.can_fire = 50
  let x_ratio = Math.sin(gun.deg * (Math.PI / 180))
  let y_ratio = -Math.cos(gun.deg * (Math.PI / 180))
  
  // Target the x,y that is the distance of the gun away from the center firing point
  const offsetIntoMuzzle = 20
  const centerX = gun.x + (gun.w / 2) - (bulletWidth / 2)
  const centerY = gun.y + gun.h - (bulletHeight / 2)
  const rad = degreesToRadians(gun.deg + 90)
  const target = endpoint(centerX, centerY, gun.h - offsetIntoMuzzle, rad)
  let x = target.x
  let y = target.y

  if (farmer.speed_x * x_ratio < 0) farmer.speed_x = 0 // correct for away farmer movement's affect on bullet trajectory

  for (let i = 0; i < BULLETS_MAX; i++) {
    if (bullets[i].dur === 0) {
      bullets[i].w = bulletWidth
      bullets[i].h = bulletHeight
      bullets[i].x = x
      bullets[i].y = y
      bullets[i].t = 1
      bullets[i].x_ratio = x_ratio
      bullets[i].y_ratio = y_ratio
      bullets[i].speed_x = farmer.speed_x
      bullets[i].dur = 70
      break
    }
  }
}

function spawnExplosion (x_origin, y_origin, x_speed, y_speed, num_of_particles) {
  for (let i = 0; i < num_of_particles; i++) {
    for (let i = 0; i < PARTICLES_MAX; i++) {
      if (particles[i] && particles[i].dur === 0) {
        particles[i].x = x_origin
        particles[i].y = y_origin
        particles[i].x_speed = x_speed + getRandomInt(-3, 3)
        particles[i].y_speed = y_speed + getRandomInt(-3, 3)
        particles[i].dur = 200
        break
      }
    }
  }
}

function spawnMeteors (num_of) {
  for (let i = 0; i < num_of; i++) {
    if (meteors[i] === undefined) continue
    
    const meteor_max_height = 40

    // to make harder, incrememnt values of size, speed, and fall angle
    const meteor_speed = 1
    const meteor_scale = getRandomInt(25, meteor_max_height)
    const meteor_fall_angle = getRandomInt(meteor_speed, 5)

    const originX = getRandomInt(0, GAME_WIDTH)
    const originY = getRandomInt((GAME_HEIGHT * -0.2), -meteor_max_height)
    const dir = originX > (GAME_WIDTH / 2) ? 1 : -1

    meteors[i].x = originX
    meteors[i].y = originY
    meteors[i].w = meteor_scale
    meteors[i].h = meteor_scale
    meteors[i].x_dir = meteor_speed * dir
    meteors[i].y_dir = meteor_speed * meteor_fall_angle
    meteors[i].t = 0
    meteors[i].blown_up = 0
  }
}

function initMeteors () {
  for (let i = 0; i < METEORS_MAX; i++) meteors[i] = {}
}

function initBullets () {
  for (let i = 0; i < BULLETS_MAX; i++) {
    bullets[i] = {
      x: 0, y: 0, w: 0, h: 0, t: 0, x_ratio: 0, y_ratio: 0, speed_x: 0, dur: 0
    }
  }
}

function initParticles () {
  for (let i = 0; i < PARTICLES_MAX; i++) {
    particles[i] = { x: 0, y: 0, w: 10, h: 10, x_speed: 0, y_speed: 0, dur: 0, t: 0 }
  }
}

function updateBullets () {
  for (let i = 0; i < bullets.length; i++) {
    bullets[i].x_ratio *= 0.99
    bullets[i].y_ratio *= 0.99
    bullets[i].x += (bullets[i].x_ratio * 8.5) + bullets[i].speed_x
    bullets[i].y += (bullets[i].y_ratio * 8.5)
  }
}

function updateMeteors () {
  for (let i = 0; i < meteors.length; i++) {
    meteors[i].x_dir *= 1.003
    meteors[i].y_dir *= 1.003
    meteors[i].x += meteors[i].x_dir
    meteors[i].y += meteors[i].y_dir
  }
}

function drawEnemies () {
  for (let i = 0; i < meteors.length; i++) {
    if (meteors[i].blown_up === 0) {
      if (debugRect) drawRect(meteors[i].x, meteors[i].y, meteors[i].w, meteors[i].h, meteors[i].t) 
      if (debugImage) ctx.drawImage(meteor, meteors[i].x - 5, meteors[i].y - 5, meteors[i].w + 10, meteors[i].h + 10)
    }
  }
}

function drawBullets () {
  for (let i = 0; i < bullets.length; i++) {
    if (bullets[i].dur > 0) {
      if (debugImage) ctx.drawImage(lasershot, bullets[i].x - 4, bullets[i].y - bullets[i].h + 6, 18, 18)
      if (debugRect) drawRect(bullets[i].x, bullets[i].y, bullets[i].w, bullets[i].h, bullets[i].t)
    }
  }
}

function drawParticles () {
  for (let i = 0; i < particles.length; i++) {
    if (particles[i].dur > 0) {
      particles[i].x += particles[i].x_speed
      particles[i].y += particles[i].y_speed

      if (debugImage) ctx.drawImage(fragment, particles[i].x, particles[i].y, particles[i].w, particles[i].h)
      if (debugRect) drawRect(particles[i].x, particles[i].y, particles[i].w, particles[i].h, particles[i].t)
      particles[i].dur--
    }
  }
}

function initCows () {
  for (let i = 0; i < cowsLeft.length; i++) {
    cowsLeft[i].x = getRandomInt(50, GAME_WIDTH)
    cowsLeft[i].x_speed = getRandomInt(0, 2) === 0 ? 1 : -1
    cowsLeft[i].switch_dur = getRandomInt(50, 300)
  }
}

function updateCows () {
  for (let i = 0; i < cowsLeft.length; i++) {
    cowsLeft[i].x += cowsLeft[i].x_speed * 0.3
    if (cowsLeft[i].switch_dur > 0) {
      cowsLeft[i].switch_dur--
    } else {
      cowsLeft[i].x_speed *= -1
      cowsLeft[i].switch_dur = getRandomInt(50, 300)
      cowsLeft[i].dir = cowsLeft[i].x_speed > 0 ?  1 : 0
    }
  }
}

function drawCows () {
  for (let i = 0; i < cowsLeft.length; i++) {
    //if (debugImage) ctx.drawImage(image, sx, sy, sWidth, sHeight, dx, dy, dWidth, dHeight);
    const spritesheet_offset = cowsLeft[i].x_speed > 0 ? 64 : 0
    if (cowsLeft[i].dead === 0) ctx.drawImage(cow, spritesheet_offset, 0, 64, 64, cowsLeft[i].x - 25, cowsLeft[i].y - 45, 64, 64)
    //if (debugRect) drawRect(cowsLeft[i].x, cowsLeft[i].y, cowsLeft[i].w, cowsLeft[i].h, cowsLeft[i].t)
  }
}

function checkCollisions () {
  for (let a = 0; a < bullets.length; a++) {
    for (let b = 0; b < meteors.length; b++) {
      if (meteors[b].blown_up === 1) continue
      if (collision(bullets[a], meteors[b])) {
        explosion_sfx.pause()
        explosion_sfx.currentTime = 0
        explosion_sfx.play()
        spawnExplosion(
          meteors[b].x + (meteors[b].w / 2),
          meteors[b].y + (meteors[b].h / 2),
          bullets[a].x_ratio * 4,
          bullets[a].y_ratio * 4,
          10)
        meteors[b].blown_up = 1
        score += 10
      }
    }
  }

  for (let c = 0; c < meteors.length; c++) {
    //if (collision(house, meteors[c])) console.log('game over')
    if (meteors[c].blown_up === 0) continue
    for (let d = 0; d < cowsLeft.length; d++) {
      if (collision(meteors[c], cowsLeft[d])) {
        moo_sfx.pause()
        moo_sfx.currentTime = 150
        moo_sfx.play()

        cowsLeft[d].dead = 1
      }
    }
  }
}

function initGame () {
  score = 0

  farmer = {
    x: canvas.width / 2 - 10,
    y: canvas.height - 30,
    w: 20,
    h: 30,
    speed_x: 0,
    speed_y: 0,
    t: 0
  }

  gun = {
    x: canvas.width / 2 - 10,
    y: canvas.height - 30,
    w: 80,
    h: 80,
    t: 0,
    deg: 0,
    can_fire: 0
  }

  house = {
    x: canvas.width / 2 - 50,
    y: canvas.height - 50,
    w: 100,
    h: 50,
    t: 2
  }

  crop = {
    x: canvas.width / 2 - 75,
    y: canvas.height - 20,
    w: 150,
    h: 20,
    t: 3
  }

  for (let i = 0; i < COWS_MAX; i++) {
    cowsLeft[i] = {
      x: 0,
      y: canvas.height - 20,
      w: 30,
      h: 20,
      t: 4,
      x_speed: 0,
      y_speed: 0,
      switch_dur: 0,
      dead: 0
    }
  }

  initMeteors()
  initParticles()
  initBullets()
  initCows()
}

function runGame (tracker) {
  let numOf = 0
  if (tracker >= 0 && tracker < 500) {
    numOf = 10
  } else {
    numOf = 20
  }

  if (tracker % 400 === 0 || tracker === 50) spawnMeteors(numOf)

  updateFarmer()
  updateGun()
  updateBullets()
  updateMeteors()
  checkCollisions()
  updateCows()

  drawEnemies()
  drawParticles()
  
  // Farm/house
  if (debugImage) ctx.drawImage(farm, house.x, house.y - house.h + 10, 110, 90)
  if (debugRect) drawRect(house.x, house.y, house.w, house.h, house.t)

  drawCows()
  // if (debugImage) ctx.drawImage(farmer.x - farmer.w, gun.y - gun.h, 75, 75)
  
  drawBullets()
  
  // Gun
  if (debugRect) drawRect(gun.x, gun.y - gun.can_fire, gun.w, gun.h, gun.t, gun.deg)
  if (debugImage) drawRect(gun.x, gun.y - gun.can_fire, gun.w, gun.h, gun.t, gun.deg, turretlayer)

  drawStats()

  //Farmer
  if (debugImage) ctx.drawImage(farmerSprite, farmer.x - farmer.w - 20, farmer.y - farmer.h - 30, 105, 90)
  if (debugRect) drawRect(farmer.x, farmer.y, farmer.w, farmer.h, farmer.t)
}

let game_is_initialized = 0
let tracker = 0
let game_is_active = 0
const splash = document.querySelector('#splash-screen')

function resetGunSound() {
  gun_sfx.volume = .2;
  gun_sfx.pause();
  gun_sfx.currentTime = 0;
}

function displaySplash() {
  splash.style.display = 'flex';
  ctx.drawImage(cow, 0, 0, 64, 64, GAME_WIDTH / 4, GAME_HEIGHT - 64, 64, 64);
  ctx.drawImage(cow, 64, 0, 64, 64, GAME_WIDTH / 9, GAME_HEIGHT - 64, 64, 64);
  ctx.drawImage(cow, 64, 0, 64, 64, GAME_WIDTH - 132, GAME_HEIGHT - 64, 64, 64);
  ctx.drawImage(farm, house.x, house.y - house.h + 10, 110, 90);
  ctx.drawImage(farmerSprite, farmer.x - farmer.w - 20, farmer.y - farmer.h - 30, 105, 90);
}

function setGameState (tracker) {
  if (game_is_active && !game_is_initialized) {
    splash.style.display = 'none'
    initGame()
    yeehaw_sfx.play()
    // bluegrass_sfx.play()
    game_is_initialized = 1
    return
  }

  if (game_is_active && game_is_initialized) {
    if (upPressed) {
      gun_sfx.play()
      fireBullet()
    } else {
      resetGunSound()
    }

    runGame(tracker)
    return
  }

  // If enter is pressed and the game isn't initialized
  if (enterPressed && !game_is_initialized) {
    startGame()
    return
  }

  // Start Screen
  initGame()
  displaySplash()
  // updateCows()
  // drawCows()
}

function startGame () {
  if (!soundsLoaded) {
    deploy = new Audio('assets/sfx/deploy.mp3')
    gun_sfx = new Audio('assets/sfx/machine-gun.mp3')
    gun_sfx.volume = .5
    yeehaw_sfx = new Audio('assets/sfx/yeehaw.wav')
    yeehaw_sfx.volume = 0
    bluegrass_sfx = new Audio('assets/sfx/bluegrass.mp3')
    bluegrass_sfx.volume = .5
    explosion_sfx = new Audio('assets/sfx/explosion.mp3')
    moo_sfx = new Audio('assets/sfx/moo-2.wav')
    soundsLoaded = true
  }

  tracker = 0
  game_is_initialized = 0
  game_is_active = 1
}

function stopGame () {
  tracker = 0
  game_is_initialized = 0
  game_is_active = 0
}

function drawStats () {
  let numOf = 0
  for (let i = 0; i < cowsLeft.length; i++) {
    if (cowsLeft[i].dead === 0) numOf++
  }

  if (numOf === 1) stopGame()

  for (let i = 0; i < numOf; i++) {
    drawText(ctx, {
      visible: true,
      text: score,
      fontSize: 26,
      horizontalPadding: 20,
      verticalPadding: 20,
      hAlignment: 'right',
      vAlignment: 'top'
    })
    ctx.drawImage(cow, 0, 0, 64, 64, i + (i * 40) + 15, 0 + 10 , 32, 32)
  } 
}

let lastTimestamp = 0; // To track the timestamp of the last frame
// instrumentation: probe halt flag. false by default, so the ambient
// requestAnimationFrame loop advances the game exactly as shipped; a
// frame-counting checkpoint freezes it and steps the simulation itself.
let __nmcHalted = false

function loop(timestamp) {
  const deltaTime = timestamp - lastTimestamp // Calculate time elapsed since the last frame
  lastTimestamp = timestamp
  
  if (deltaTime >= 16 && !__nmcHalted) {
    tracker++
    ctx.clearRect(0, 0, canvas.width, canvas.height)
    setGameState(tracker)
  }

  window.requestAnimationFrame(loop)
}
window.requestAnimationFrame(loop)

// ===== repair-bench instrumentation bridge (window.__NMC__) =================
// Appended INSIDE the page's own inline script so the probe closes over the
// live game variables instead of mirroring them. Two strictly separated halves:
//
//   __NMC__.state    - PURE READS. Every member is a getter (or a plain
//                      expression over the live variables) that re-reads them
//                      at access time. Nothing is cached, snapshotted, copied
//                      or subscribed to, and reading state never mutates the
//                      game. Every assert in tests/dsl.json reads only this.
//   __NMC__.scenario - SIDE EFFECTS, for checkpoint SETUP steps only. It calls
//                      the page's own functions (startGame / stopGame /
//                      setGameState / fireBullet / checkCollisions /
//                      spawnMeteors / initMeteors) and dispatches real
//                      KeyboardEvent / click() objects, so what runs is the
//                      production listener chain, not a re-implementation.
//                      No assertion ever calls into scenario.
//
// __nmcHalted (declared above, next to the ambient loop) defaults to false, so
// an uninstrumented-looking page behaves exactly as shipped; frame-counting
// checkpoints freeze the ambient requestAnimationFrame loop and advance the
// simulation themselves, while timeline checkpoints leave it running.
;(function () {
  var marks = { farmerX: null, score: null, bulletY: null }
  var rnd2 = function (n) { return (typeof n === 'number' && isFinite(n)) ? Math.round(n * 100) / 100 : null }
  var isSpawned = function (m) { return !!m && typeof m.x === 'number' }
  var liveMeteors = function () { return meteors.filter(function (m) { return isSpawned(m) && m.blown_up === 0 }) }
  var liveBullets = function () { return bullets.filter(function (b) { return b && b.dur > 0 }) }
  var aliveCows = function () { return cowsLeft.filter(function (c) { return c && c.dead === 0 }).length }
  var keyEvent = function (code, down) {
    document.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', { code: code, bubbles: true }))
  }
  var frame = function () { tracker++; setGameState(tracker) }
  var ALL_KEYS = ['ArrowRight', 'ArrowLeft', 'ArrowUp', 'Space', 'KeyD', 'KeyA', 'Enter']

  var state = {
    get score () { return score },
    get scoreSinceMark () { return marks.score === null ? null : score - marks.score },
    get cowsTotal () { return cowsLeft.length },
    get cowsAlive () { return aliveCows() },
    get farmerX () { return rnd2(farmer ? farmer.x : null) },
    get farmerY () { return rnd2(farmer ? farmer.y : null) },
    get farmerMovedSinceMark () { return (marks.farmerX === null || !farmer) ? null : rnd2(farmer.x - marks.farmerX) },
    get gunDeg () { return rnd2(gun ? gun.deg : null) },
    get gunAbsDeg () { return gun ? Math.abs(Math.round(gun.deg)) : null },
    get gunX () { return rnd2(gun ? gun.x : null) },
    get gunY () { return rnd2(gun ? gun.y : null) },
    get gunCanFire () { return gun ? gun.can_fire : null },
    get gunFollowsFarmer () {
      return !!(farmer && gun && rnd2(gun.x) === rnd2(farmer.x + (farmer.w / 2) - (gun.w / 2)))
    },
    get bulletsLive () { return liveBullets().length },
    get bulletX0 () { var b = liveBullets()[0]; return b ? rnd2(b.x) : null },
    get bulletY0 () { var b = liveBullets()[0]; return b ? rnd2(b.y) : null },
    get bulletY0SinceMark () {
      var b = liveBullets()[0]
      return (marks.bulletY === null || !b) ? null : rnd2(b.y - marks.bulletY)
    },
    get muzzleAboveFarmer () { var b = liveBullets()[0]; return !!(b && farmer && b.y < farmer.y) },
    get meteorsOnScreen () { return liveMeteors().filter(function (m) { return m.y < GAME_HEIGHT }).length },
    get meteorsBlown () { return meteors.filter(function (m) { return isSpawned(m) && m.blown_up === 1 }).length },
    get meteorsAllFalling () { return liveMeteors().every(function (m) { return m.y_dir > 0 }) },
    get outwardDrifters () {
      return liveMeteors().filter(function (m) {
        return m.x > (GAME_WIDTH / 2) ? m.x_dir >= 0 : m.x_dir <= 0
      }).length
    },
    get particlesLive () { return particles.filter(function (p) { return p && p.dur > 0 }).length },
    get tracker () { return tracker },
    get gameActive () { return game_is_active },
    get gameInitialized () { return game_is_initialized },
    get enterHeld () { return enterPressed },
    get splashDisplay () { return splash.style.display },
    get canvasWidth () { return canvas.width },
    get canvasHeight () { return canvas.height },
    get musicVolume () { return bluegrass_sfx ? bluegrass_sfx.volume : null },
    get soundsLoaded () { return soundsLoaded },
    get muteButtonLabel () {
      var el = document.getElementById('mute-button')
      return el ? el.textContent : null
    },
    get halted () { return __nmcHalted }
  }

  var scenario = {
    halt: function () { __nmcHalted = true },
    run: function () { __nmcHalted = false },
    frame: frame,
    step: function (n) { for (var i = 0; i < n; i++) frame() },
    boot: function () { scenario.clearKeys(); stopGame(); startGame(); frame(); return state.gameInitialized },
    toSplash: function () { scenario.clearKeys(); stopGame(); return state.gameActive },
    key: function (code, down) { keyEvent(code, down) },
    clearKeys: function () { ALL_KEYS.forEach(function (c) { keyEvent(c, false) }) },
    pressEnterOnce: function () { keyEvent('Enter', true); frame(); keyEvent('Enter', false) },
    holdEnter: function () { keyEvent('Enter', true) },
    fire: function () { fireBullet() },
    clearMeteors: function () { initMeteors() },
    spawnWave: function (n) { spawnMeteors(typeof n === 'number' ? n : 10) },
    placeMeteor: function (i, o) {
      var m = meteors[i] || (meteors[i] = {})
      m.x = o.x; m.y = o.y; m.w = o.w; m.h = o.h
      m.x_dir = (o.x_dir === undefined ? 0 : o.x_dir)
      m.y_dir = (o.y_dir === undefined ? 0 : o.y_dir)
      m.t = 0; m.blown_up = 0
      return i
    },
    placeCow: function (i, o) {
      var c = cowsLeft[i]
      if (!c) return -1
      if (o.x !== undefined) c.x = o.x
      if (o.y !== undefined) c.y = o.y
      if (o.dead !== undefined) c.dead = o.dead
      if (o.x_speed !== undefined) c.x_speed = o.x_speed
      if (o.switch_dur !== undefined) c.switch_dur = o.switch_dur
      return i
    },
    killCowsBut: function (keep) {
      for (var i = 0; i < cowsLeft.length; i++) cowsLeft[i].dead = (i < keep) ? 0 : 1
      return aliveCows()
    },
    setFarmerX: function (x) { if (farmer) farmer.x = x },
    setGunDeg: function (d) { if (gun) gun.deg = d },
    hitMeteor: function (i) {
      var b = liveBullets()[0]
      if (!b) return false
      var m = meteors[i] || (meteors[i] = {})
      m.x = b.x - 5; m.y = b.y - 5; m.w = b.w + 10; m.h = b.h + 10
      m.x_dir = 0; m.y_dir = 0; m.t = 0; m.blown_up = 0
      checkCollisions()
      return m.blown_up === 1
    },
    clickMute: function () {
      var el = document.getElementById('mute-button')
      if (!el) return false
      el.click()
      return true
    },
    markFarmerX: function () { marks.farmerX = farmer ? farmer.x : null; return marks.farmerX },
    markScore: function () { marks.score = score; return marks.score },
    markBulletY: function () { var b = liveBullets()[0]; marks.bulletY = b ? b.y : null; return marks.bulletY },
    resetMarks: function () { marks.farmerX = null; marks.score = null; marks.bulletY = null }
  }

  Object.defineProperty(window, '__NMC__', {
    value: { state: state, scenario: scenario, marks: marks, version: 'instrumentation-1' },
    writable: true, configurable: true, enumerable: false
  })
})()
</script>
