<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="">

  <title>Moovie.js | Movie Focused HTML5 Player</title>

  <!-- Bootstrap core CSS -->
  <link href="demo-template/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <!-- Moovie CSS Style -->
  <link rel="stylesheet" type="text/css" href="css/moovie.css">

  <!-- GFonts -->
  <!-- offline harness: the remote font preconnect is gone; this tree must render with no network at all -->
  <link href="rb-offline/inert.css" rel="stylesheet"> 

</head>

<body style="background-color:#10131a;" data-testid="rb-body">

  <!-- Page Content -->
  <div class="container" data-testid="rb-container">
      
    <div class="row" data-testid="rb-row">
      <div class="col-lg-12 text-center" data-testid="rb-col">
           <div style='max-width: 900px; position: relative; margin: 0 auto; margin-top: 0px; margin-top: 0px; margin-top: 43px;'>
              <img src="demo-template/images/moovie_white.png" style="max-width: 214px;" data-testid="rb-logo">
              <p style="margin-bottom: 49px; font-size: 28pt; color: white; font-family: Montserrat;" data-testid="rb-tagline">Media player made for movies</p>
            </div>
            
            <div style='max-width: 800px; position: relative; margin: 0 auto; margin-top: 0px; margin-top: 64px;' data-testid="rb-stage">
                <video id="example" data-testid="rb-media" poster="demo-template/images/poster.png">
                    <!-- offline harness: the remote trailer is gone. rb-offline/boot.js generates a local silent PCM WAV blob of an exact duration (12 s) and attaches it to this element before the player is constructed, so every time-based reading is reproducible and nothing is fetched. -->
                    <track kind="captions" label="Portuguese" srclang="pt" src="demo-template/subtitles/pt.vtt" data-testid="rb-track-pt">
                    <track kind="captions" label="English" srclang="en" src="demo-template/subtitles/en.vtt" data-testid="rb-track-en">
                    <track kind="captions" label="French" srclang="en" src="demo-template/subtitles/french.srt" data-testid="rb-track-fr">
                    Your browser does not support the video tag.
                </video>
                <a class="btn btn-dark" href="#" data-testid="rb-download" style="margin-top:50px; margin-bottom: 130px;">Download on GitHub</a>
            </div>
      </div>
    </div>
  </div>
  <!-- Moovie JS Core -->
  <script src="rb-offline/boot.js"></script>
  <script src="js/moovie.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
            rbAttachMedia("example", 12);
            window.rbPlayer = new Moovie({
              selector: "#example",
              moovie_internalID: "rbA",
              dimensions: {
                   width: "100%"
              },
              config: {
                  storage: {
                     captionOffset: false,
                     playrateSpeed: false,
                     captionSize: false
                  }
              }
            });
    });
  </script>
</body>

</html>
