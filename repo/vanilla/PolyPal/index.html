<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>PolyPal SVG Editor</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/favicon.png" />
  </head>
  <body>
    <div class="svg-canvas" data-testid="pp-svg-canvas">
      <svg 
        version="1.1"
        baseProfile="full"
        width="100%" 
        height="100%"
        xmlns="http://www.w3.org/2000/svg"
        class="svg-image"
        data-testid="pp-svg-image">
      </svg>
      <svg class="svg-points" data-testid="pp-svg-points"></svg>
    </div>

    <div class="top-ui">
      <span class="logo">PolyPal Editor</span>

      <button class="save"    text="Save this picture, it will be here when you come back." data-testid="pp-btn-save">Save</button>
      <button class="load"    text="Load the last-saved picture." data-testid="pp-btn-load">Load</button>

      <button class="reset"   text="Delete everything and start over." data-testid="pp-btn-reset">Reset</button>

      <button class="download" text="Download this image as an SVG." data-testid="pp-btn-download">Download SVG</button>
      &mdash;
      Extrude type
      <button class="extrude" text="Build with squares." type="line" data-testid="pp-btn-extrude-line">&#9724;</button>
      <button class="extrude" text="Build with triangles." type="point" data-testid="pp-btn-extrude-point">&#9650;</button>
      &mdash;
      <button class="undo"    text="Undo the last action." data-testid="pp-btn-undo">Undo</button>
      <button class="delete"  text="Delete selected points & shapes." data-testid="pp-btn-delete">Delete</button>
      &mdash;
      Z-index
      <button class="z-up"    text="Move the shape 1 higher (+ Shift for very top)." data-testid="pp-btn-z-up">&uarr;</button>
      <button class="z-down"  text="Move the shape 1 lower (+ Shift for very bottom)." data-testid="pp-btn-z-down">&darr;</button>
    </div>

    <div class="bottom-ui">
      <span>Scale</span>
      <input type="range" class="scale" min="-1" value="0" max="1" step=".05" data-testid="pp-slider-scale">
      <span>Rotate</span>
      <input type="range" class="rotate" min="-180" value="0" max="180" step=".25" data-testid="pp-slider-rotate">
    </div>

    <!-- Toolbars -->
    <div class="colors" data-testid="pp-colors-bar"></div>
    <div class="tools" data-testid="pp-tools-bar"></div>

    <!-- Code -->
    <script src="js/editor/utils.js"></script>
    <script src="js/editor/savedpics.js"></script>
    <script src="js/editor/vars.js"></script>
    <script src="js/editor/tools.js"></script>
    <script src="js/editor/zindex.js"></script>
    <script src="js/editor/settings.js"></script>
    <script src="js/editor/scale.js"></script>
    <script src="js/editor/draw.js"></script>
    <script src="js/editor/grid.js"></script>
    <script src="js/editor/colors.js"></script>
    <script src="js/editor/memory.js"></script>
    <script src="js/editor/index.js"></script>
    <script src="js/editor/listeners.js"></script>
    <script src="js/editor/keys.js"></script>
    <script src="js/editor/tool-create.js"></script>
    <script src="js/editor/rb-probe.js"></script>

  </body>
</html>
