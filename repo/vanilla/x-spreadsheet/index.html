<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title><%= htmlWebpackPlugin.options.title %></title>
</head>
<body onload="load()">
  <div id="x-spreadsheet-demo"></div>
  <script>
    function load(){
      var rows = {
        len: 100,
        0: { cells: { 0: { text: 'Item' }, 1: { text: 'Qty' }, 2: { text: 'Price' }, 3: { text: 'Total' }, 5: { text: 'A-0' } } },
        1: { cells: { 0: { text: 'Alpha' }, 1: { text: '30' }, 2: { text: '10' }, 3: { text: '=B2*C2' } } },
        2: { cells: { 0: { text: 'Beta' }, 1: { text: '10' }, 2: { text: '20' }, 3: { text: '=B3*C3' } } },
        3: { cells: { 0: { text: 'Gamma' }, 1: { text: '50' }, 2: { text: '30' }, 3: { text: '=B4*C4' } } },
        4: { cells: { 0: { text: 'Delta' }, 1: { text: '20' }, 2: { text: '40' }, 3: { text: '=B5*C5' } } },
        5: { cells: { 0: { text: 'Epsilon' }, 1: { text: '40' }, 2: { text: '50' }, 3: { text: '=B6*C6' } } },
        6: { cells: { 0: { text: 'Plain' } } },
        7: { cells: { 0: { text: 'BoldCell', style: 1 } } },
        9: { cells: { 0: { text: 'SharedA', style: 0 } } },
        11: { cells: { 0: { text: 'SharedB', style: 0 } } },
        13: { cells: { 0: { text: '2026-03-15' } } }
      };
      var xs = x_spreadsheet('#x-spreadsheet-demo', {
        showToolbar: true,
        showGrid: true,
        showBottomBar: true
      }).loadData([{
        name: 'sheet1',
        styles: [
          {
            bgcolor: '#ffffff',
            textwrap: false,
            color: '#0a0a0a',
            font: { name: 'Arial', size: 10, bold: false, italic: false }
          },
          {
            bgcolor: '#ffffff',
            textwrap: false,
            color: '#0a0a0a',
            font: { name: 'Arial', size: 10, bold: true, italic: false }
          }
        ],
        validations: [
          {
            refs: ['A14'], mode: 'cell', type: 'date', required: false,
            operator: 'be', value: ['2026-01-01', '2026-12-31']
          },
          {
            refs: ['C14'], mode: 'cell', type: 'list', required: false,
            operator: '', value: 'red,green,blue'
          }
        ],
        cols: { len: 26 },
        rows: rows
      }, {
        name: 'sheet2',
        rows: {
          len: 20,
          0: { cells: { 0: { text: 'S2-Alpha' } } },
          1: { cells: { 1: { text: 'S2-Beta' } } }
        }
      }]);
      window.xs = xs;
      setTimeout(() => {
        xs.cellText(40, 9, 'timer-probe').reRender();
      }, 5000);
    }
  </script>
</body>
</html>
