<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOON LOVERS - QUIZ</title>
    <link rel="stylesheet" href="../css/SH_style.css" />
</head>

<body>
    <section class="main" data-testid="kq-main">
        <div class="container" data-testid="kq-container">
            <div class="col" data-testid="kq-question-col">
                <h3 id="questionBox" data-testid="kq-question">
                    1) Lorem ipsum dolor sit amet, consectetur adipisicing elit Debitis? Lorem ipsum dolor sit amet
                    consectetur adipisicing elit. Dolores perferendis non voluptas rem, quos omnis accusamus. Architecto
                    necessitatibus animi laudantium dignissimos eveniet adipisci.
                </h3>
            </div>
            <div class="col box" data-testid="kq-optrow-1">
                <input name="option" type="radio" id="first" value="a" required data-testid="kq-option-1">
                <label for="first" data-testid="kq-label-1">Testing 1</label>
            </div>
            <div class="col box" data-testid="kq-optrow-2">
                <input name="option" type="radio" id="second" value="b" required data-testid="kq-option-2">
                <label for="second" data-testid="kq-label-2">Testing 2</label>
            </div>
            <div class="col box" data-testid="kq-optrow-3">
                <input name="option" type="radio" id="third" value="c" required data-testid="kq-option-3">
                <label for="third" data-testid="kq-label-3">Testing 3</label>
            </div>
            <div class="col box" data-testid="kq-optrow-4">
                <input name="option" type="radio" id="fourth" value="d" required data-testid="kq-option-4">
                <label for="fourth" data-testid="kq-label-4">Testing 4</label>
            </div>
            <button id="submit" data-testid="kq-submit">Submit</button>
        </div>
    </section>
    
    <script src="../js/quizzes/SG_script.js"></script>
    <script src="../js/quiz_engine.js"></script>
</body>

</html>
