<div id="tools_bottom">
    <!-- Zoom buttons -->
    <se-zoom id="zoom" data-testid="zoom" src="zoom.svg" title="Change zoom level" inputsize="40px">
      <se-text value="1000" text="1000%" data-testid="zoom-opt-1000"></se-text>
      <se-text value="400" text="400%" data-testid="zoom-opt-400"></se-text>
      <se-text value="200" text="200%" data-testid="zoom-opt-200"></se-text>
      <se-text value="100" text="100%" data-testid="zoom-opt-100"></se-text>
      <se-text value="50" text="50%" data-testid="zoom-opt-50"></se-text>
      <se-text value="25" text="25%" data-testid="zoom-opt-25"></se-text>
      <se-text value="canvas" text="tools.fit_to_canvas" data-testid="zoom-opt-canvas"></se-text>
      <se-text value="selection" text="tools.fit_to_sel" data-testid="zoom-opt-selection"></se-text>
      <se-text value="layer" text="tools.fit_to_layer_content" data-testid="zoom-opt-layer"></se-text>
      <se-text value="content" text="tools.fit_to_all" data-testid="zoom-opt-content"></se-text>
    </se-zoom>
    <se-colorpicker id="fill_color" data-testid="fill_color" src="fill.svg" label="properties.fill_color" type="fill"></se-colorpicker>
    <se-colorpicker id="stroke_color" data-testid="stroke_color" src="stroke.svg" label="properties.stroke_color" type="stroke"></se-colorpicker>
    <se-spin-input id="stroke_width" data-testid="stroke_width" min=0 max=99 step=1 title="properties.stroke_width" label=""></se-spin-input>
    <se-select id="stroke_style" title="properties.stroke_style" label="" width="22px" height="22px"
      options="&#8212;,...,- -,- .,- .."
      values="none::2,2::5,5::5,2,2,2::5,2,2,2,2,2">     
    </se-select>
    <se-list id="stroke_linejoin" title="properties.linejoin_miter" label="" width="22px" height="22px">
      <se-list-item id="linejoin_miter" value="miter" src="linejoin_miter.svg" title="properties.linejoin_miter" img-height="22px"></se-list-item>
      <se-list-item id="linejoin_round" value="round" src="linejoin_round.svg" title="properties.linejoin_round" img-height="22px"></se-list-item>
      <se-list-item id="linejoin_bevel" value="bevel" src="linejoin_bevel.svg" title="properties.linejoin_bevel" img-height="22px"></se-list-item>
    </se-list>
    <se-list id="stroke_linecap" title="properties.linecap_butt" label="" width="22px" height="22px">
      <se-list-item id="linecap_butt" value="butt" src="linecap_butt.svg" title="properties.linecap_butt" img-height="22px"></se-list-item>
      <se-list-item id="linecap_square" value="square" src="linecap_square.svg" title="properties.linecap_square" img-height="22px"></se-list-item>
      <se-list-item id="linecap_round" value="round" src="linecap_round.svg" title="properties.linecap_round" img-height="22px"></se-list-item>
    </se-list>
    <se-spin-input size="3" id="opacity" data-testid="opacity" min=0 max=100 step=5 title="properties.opacity" src="opacity.svg"></se-spin-input>
    <se-palette id="palette" data-testid="palette"></se-palette>
  </div>
