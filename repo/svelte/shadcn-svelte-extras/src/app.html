<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<!-- RepairBench instrumentation (environment/instrumentation.patch): the neutral read-only probe.
		     A CLASSIC script in <head>, so it runs before Kit's module scripts and before the cookie
		     script below - that ordering is what makes the probe's storage/cookie wipe observable to the
		     app. It renders nothing, adds no element, class or attribute and no data-testid, and it imports
		     no application module. See static/rb-probe.js for the full contract. -->
		<script src="%sveltekit.assets%/rb-probe.js"></script>
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			const USER_CONFIG_COOKIE_NAME = 'extras_user_config';
			const cookieMap = {};
			document.cookie.split(';').forEach((pair) => {
				const [key, value] = pair.trim().split('=');
				cookieMap[key] = value;
			});
			const userConfigCookie = cookieMap[USER_CONFIG_COOKIE_NAME];
			if (userConfigCookie) {
				try {
					const userConfig = JSON.parse(decodeURIComponent(userConfigCookie));
					if (userConfig.layout) {
						document.documentElement.classList.add(`layout-${userConfig.layout}`);
					}
				} catch (e) {
					console.error('Error parsing user config cookie:', e);
				}
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="[--header-height:56px]">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
