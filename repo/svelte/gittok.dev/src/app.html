<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Primary Meta Tags -->
		<title>Gittok - Discover Trending GitHub Projects</title>
		<meta name="title" content="Gittok - Discover Trending GitHub Projects">
		<meta name="description" content="A TikTok-style feed for discovering trending GitHub repositories and topics. Your productive alternative to endless scrolling - learn, discover, and stay updated with the tech world.">

		<!-- Viewport and Theme Colors -->
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<meta name="theme-color" content="#111827">
		<meta name="color-scheme" content="dark light">

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://gittok.dev">
		<meta property="og:title" content="Gittok - Discover Trending GitHub Projects">
		<meta property="og:description" content="Swipe through trending GitHub repositories and topics in a fun, TikTok-style interface. Turn your scrolling habit into learning opportunities.">
		<meta property="og:image" content="https://gittok.dev/screenshot-1.png">

		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image">
		<meta property="twitter:url" content="https://gittok.dev">
		<meta property="twitter:title" content="Gittok - Trending GitHub Explorer">
		<meta property="twitter:description" content="Discover trending GitHub projects in a TikTok-style feed. Make your screen time more productive with curated tech content.">
		<meta property="twitter:image" content="https://gittok.dev/screenshot-1.png">

		<!-- Keywords -->
		<meta name="keywords" content="gittok, github trends, programming, coding, developer tools, tech discovery, repositories, open source, software engineering, coding projects, tech learning">

		<!-- Favicon and App Icons -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any">
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png">
		<link rel="manifest" href="%sveltekit.assets%/manifest.json">

		<!-- RepairBench adaptation A1: the two jsdelivr CDN references that sat here are retired for the
		     offline face. No graded surface reads .markdown-body, and a 0-network leg must not depend on
		     a third-party stylesheet. The link element is left out entirely rather than repointed, so the
		     adapted face references 0 external origins from the document shell. -->

		<!-- Robots and Canonical -->
		<meta name="robots" content="index, follow">
		<link rel="canonical" href="https://gittok.dev/">

		%sveltekit.head%
	</head>
	<!-- RepairBench adaptation A2: the googletagmanager beacon and its inline gtag bootstrap are retired
	     for the offline face. Analytics are an external origin and are never a graded symptom. -->
	<body data-sveltekit-preload-data="hover">
		<div style="display: block">%sveltekit.body%</div>
	</body>
</html>
