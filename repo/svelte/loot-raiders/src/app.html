<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
		/>

		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#0b0c15" />

		<link rel="icon" href="/icon-192.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Loot Raiders" />

		<script>
			// Repair-Bench instrumentation: deterministic RNG so loot drops are reproducible.
			(function () {
				function mulberry32(a) {
					return function () {
						a |= 0;
						a = (a + 0x6d2b79f5) | 0;
						var t = Math.imul(a ^ (a >>> 15), 1 | a);
						t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
						return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
					};
				}
				Math.random = mulberry32(0x5eed1);
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
